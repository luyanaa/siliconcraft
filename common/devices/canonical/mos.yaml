# Process-independent canonical MOS device contracts.
#
# mos4 keeps interchangeable drain/source semantics.  asymmetric_mos4 is
# intentionally separate: LDMOS/DMOS source and drain roles come from the
# drift geometry and must not be silently permuted as ordinary MOS4.
schema_version: 3
family: device_families
default_family: mos4
families:
  mos4:
    device:
      id: mos4
      kind: mos4
      terminals:
        - d
        - g
        - s
        - b
      terminal_order:
        - d
        - g
        - s
        - b
      geometry:
        required:
          - w
          - l
        optional:
          - nf
          - m
          - ad
          - as
          - pd
          - ps
        parameter_units:
          w: um
          l: um
          nf: count
          m: count
          ad: um2
          as: um2
          pd: um
          ps: um
        parameter_semantics:
          w: "channel width per physical gate finger"
          l: "channel length"
          nf: "physical gate-finger count; controls layout geometry"
          m: "electrical multiplicity; does not change one-instance layout geometry"
          effective_width: "w * nf * m"
      attributes:
        polarity:
          - n
          - p
        voltage_class: profile_defined
        oxide_class: profile_defined
        threshold_class: profile_defined
        channel_class: profile_defined
        gate_stack: profile_defined
        isolation: profile_defined
        isolation_domain: legacy_optional
        topology: symmetric
        silicided: optional
      semantics:
        w: "channel width per physical gate finger"
        l: "channel length"
        nf: "physical gate-finger count; absent means one"
        m: "electrical multiplicity; absent means one and does not change one-instance geometry"
        effective_width: "w * nf * m"
        ad: "drain diffusion area when the model family consumes it"
        as: "source diffusion area when the model family consumes it"
        pd: "drain diffusion perimeter when the model family consumes it"
        ps: "source diffusion perimeter when the model family consumes it"
      symmetry_groups:
        -
          - d
          - s
      parasitics:
        gate_intrinsic: model
        gate_overlap: model
        junction_area_cap: model
        junction_sidewall_cap: model
        diffusion_sheet_r: pex
        gate_sheet_r: disabled
    variants:
      nmos_core:
        polarity: n
        voltage_class: lv
        gate_stack: core
        isolation_domain: bulk
        topology: symmetric
      pmos_core:
        polarity: p
        voltage_class: lv
        gate_stack: core
        isolation_domain: bulk
        topology: symmetric
      nmos_hv_sym:
        polarity: n
        voltage_class: hv
        gate_stack: hv
        isolation_domain: bulk
        topology: symmetric
      pmos_hv_sym:
        polarity: p
        voltage_class: hv
        gate_stack: hv
        isolation_domain: bulk
        topology: symmetric
      nmos_isolated:
        polarity: n
        voltage_class: lv
        gate_stack: core
        isolation_domain: deep_nwell_pwell
        topology: symmetric
      pmos_isolated:
        polarity: p
        voltage_class: lv
        gate_stack: core
        isolation_domain: deep_nwell
        topology: symmetric
  asymmetric_mos4:
    device:
      id: asymmetric_mos4
      kind: asymmetric_mos4
      terminals:
        - d
        - g
        - s
        - b
      terminal_order:
        - d
        - g
        - s
        - b
      terminal_semantics:
        d: "drain side; recognized from the drift-side geometry"
        s: "source side; recognized from the source diffusion geometry"
        b: "bulk or isolated-well terminal"
        symmetry: "d/s are not permutable"
      geometry:
        required:
          - w
          - l
        optional:
          - nf
          - m
          - ad
          - as
          - pd
          - ps
        parameter_units:
          w: um
          l: um
          nf: count
          m: count
          ad: um2
          as: um2
          pd: um
          ps: um
      attributes:
        polarity:
          - n
          - p
        voltage_class: profile_defined
        oxide_class: profile_defined
        threshold_class: profile_defined
        channel_class: profile_defined
        gate_stack: profile_defined
        isolation: profile_defined
        isolation_domain: legacy_optional
        topology: asymmetric_drift
      symmetry_groups: []
      parasitics:
        gate_intrinsic: model
        gate_overlap: model
        junction_area_cap: model
        junction_sidewall_cap: model
        diffusion_sheet_r: pex
        drift_sheet_r: pex
        gate_sheet_r: disabled
    variants:
      nldmos:
        polarity: n
        voltage_class: hv
        gate_stack: hv
        isolation_domain: auto_hv
        topology: asymmetric_drift
        source_drain_semantics: explicit
      pldmos:
        polarity: p
        voltage_class: hv
        gate_stack: hv
        isolation_domain: hv_nwell
        topology: asymmetric_drift
        source_drain_semantics: explicit
maturity_levels:
  - structural
  - functional
  - characterized
  - signoff
