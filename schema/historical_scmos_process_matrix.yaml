    source: mosis_scmos_7_2

rule_overlays:
  standard:
    lambda_convention: "Historically one half of minimum gate length."
    source: magic_catalog
    integer_lambda_contract:
      minimum_gate_length_lambda: 2
      minimum_metal_width_lambda: 3
      minimum_diffusion_width_lambda: 3
      minimum_contact_size_lambda: 4
  tight_metal:
    source: mosis_scmos_7_2
    magic_source: scmos-tm.tech
    differences_from_standard:
      - rule: metal1_spacing
        standard_lambda: 3
        tight_metal_lambda: 2
      - rule: metal2_spacing
        standard_lambda: 4
        tight_metal_lambda: 3
      - rule: metal3_spacing
        standard_lambda: 4
        tight_metal_lambda: 4
  subm:
    source: mosis_scmos_7_2
    differences_from_standard:
      - rule: well_width
        standard_lambda: 10
        subm_lambda: 12
      - rule: well_spacing_different_potential
        standard_lambda: 9
        subm_lambda: 18
      - rule: well_overlap_transistor
        standard_lambda: 5
        subm_lambda: 6
      - rule: poly_spacing
        standard_lambda: 2
        subm_lambda: 3
      - rule: contact_spacing
        standard_lambda: 2
        subm_lambda: 3
      - rule: via_on_flat
        standard_lambda: 2
        subm_lambda: unrestricted
      - rule: metal2_spacing
        standard_lambda: 4
        subm_lambda: 3
      - rule: metal3_width
        standard_lambda: 6
        subm_lambda: 5
      - rule: metal3_spacing
        standard_lambda: 4
        subm_lambda: 3
    extended_observations:
      - "Southampton SCMOS 8.0 records wider SUBM metal spacing and substantially different poly2/electrode rules."
      - "SUBM is a rule-family choice; it is not a license to import DEEP variants."
  hp_cmos14_contact_policy:
    source: mosis_scmos_7_2
    requirements:
      - "Insulator contacts and vias use the exact standard contact size."
      - "Pads and large openings use arrays; do not infer a single oversized contact."

processes:
  - name: orbit_20
    ncsu_gap_name: ORBIT_SCNA2
    vendor_labels:
      - ORBIT 2.0
      - SCNA20(ORB)
      - SCPE20(ORB)
    feature_size_um: 2.0
    lambda_um: 1.0
    rule_family: scmos
    mosis_codes:
      - SCNA
      - SCNE
      - SCN
      - SCNA_MEMS
    capabilities:
      - analog_npn
      - buried_ccd
      - floating_gate
      - electrode_poly2
      - mems
    variants:
      - code: SCNA
        role: analog_n_well_cmos_bjt
      - code: SCNE
        role: electrode_poly2_option
      - code: SCNA_MEMS
        role: analog_mems_option
    source: mosis_scmos_7_2
    magic:
      bundled_historical_styles:
        - SCNA20(ORB)
        - SCPE20(ORB)
      bundled_style_context: "OLD_EXTRACT_STYLE and STANDARD conditional branches in scmos.tech.in"
      archive_feature_techfile: SCNA_MEMS.80.tech27
      archive_feature_target_label: "AMIabn"
      exact_orbit_archive_target: false
      note: "The archive SCNA.80/SCNA_MEMS.80 files expose the analog/NPN/poly2/MEMS grammar but are labeled AMIabn; Orbit's exact historical PEX is in the bundled SCNA20(ORB) style."
    status: historical_reference
  - name: ami_abn_12
    ncsu_gap_name: AMI_ABN_12
    vendor_labels:
      - AMI ABN 1.2
      - AMI 1.2
    feature_size_um: 1.2
    lambda_um: 0.6
    rule_family: scmos
    mosis_codes:
      - SCNA
      - SCNE
      - SCN
    options:
      - high_voltage
    capabilities:
      - analog_npn
      - buried_ccd
      - electrode_poly2
      - high_voltage
    source: mosis_scmos_7_2
    magic:
      generic_archive_techfile: SCNA.80.tech27
      generic_archive_target_label: "AMIabn"
      generic_archive_feature_size_um: 1.6
      exact_12um_archive_target: false
      note: "The 2002a SCNA.80 file is an AMIabn 1.6um/lambda-0.8 generic analog style; it is not silently used as the AMI ABN 1.2um target."
    status: historical_reference
  - name: hp_cmos34
    ncsu_gap_name: HP_CMOS34
    vendor_labels:
      - HP CMOS34
      - AMOSI
      - SCN12LC(HP)
    feature_size_um: 1.2
    lambda_um: 0.6
    rule_family: scmos
    mosis_codes:
      - SCNLC
      - SCN
    options:
      - tight_metal
    capabilities:
      - linear_capacitor
      - tight_metal
    source: mosis_scmos_7_2
    magic:
      bundled_historical_style: SCN12LC(HP)
      bundled_style_context: "TIGHTMETAL conditional branch in scmos.tech.in"
      archive_exact_techfile: false
      note: "scmos-tm.tech carries the lambda=0.6(hp) geometry/PEX family; the old bundled source names the process-specific linear-cap style SCN12LC(HP)."
    status: historical_reference
  - name: ami_cwl
    ncsu_gap_name: AMI_CWL
    vendor_labels:
      - AMI CWL
      - SCNPC
    feature_size_um: 0.8
    lambda_um: 0.5
    rule_family: scmos
    mosis_codes:
      - SCNPC
    options:
      - tight_metal
    capabilities:
      - poly_capacitor
      - tight_metal
    source: mosis_scmos_7_2
    magic:
      generic_layer_contract: polycap
      exact_archive_techfile: false
      note: "SCNPC is the distinct POLY_CAP1/CPC option; do not substitute the cap-well/CWC LC option."
    status: historical_reference
  - name: hp_cmos26b_legacy
    ncsu_gap_name: HP_CMOS26B
    vendor_labels:
      - HP CMOS26B
      - SCN08(HP)
    feature_size_um: 1.0
    lambda_um: 0.5
    rule_family: scmos
    mosis_codes:
      - SCN3M
    options:
      - tight_metal
    capabilities:
      - metal3
      - tight_metal
    source: bundled_magic_source
    magic:
      bundled_historical_style: SCN08(HP)
      bundled_style_context: "TIGHTMETAL conditional branch in scmos.tech.in"
      archive_2002a_techfile: SCN3M.50.tech27
      archive_header_target_label: HPcmos26g
      exact_process_alias: false
      rich_pex: true
      note: "The bundled source explicitly calls the lambda=0.5 style HP CMOS26B; the archive file with the same lambda is labeled HPcmos26g. Preserve both labels instead of silently collapsing B and G."
    status: historical_reference
  - name: hp_cmos26g
    ncsu_gap_name: HP_CMOS26G
    vendor_labels:
      - HP CMOS26G
      - HPcmos26g
      - SCN3M.50.tech27
    feature_size_um: 0.8
    lambda_um: 0.5
    rule_family: scmos
    mosis_codes:
      - SCN3M
      - SCN
    options:
      - tight_metal
    capabilities:
      - metal3
      - tight_metal
    source: mosis_scmos_7_2
    magic:
      archive_2001a_techfile: SCN3M.50.tech27
      archive_2002a_techfile: SCN3M.50.tech27
      archive_header_target_label: HPcmos26g
      exact_process_alias: true
      rich_pex: true
      bundled_conflicting_style: SCN08(HP)
      note: "The archive's HPcmos26g target is retained separately from the bundled HP CMOS26B historical branch, even though both use lambda=0.5 3M extraction grammar."
    status: historical_reference
  - name: hp_cmos26g_subm
    ncsu_gap_name: HP_CMOS26G
    vendor_labels:
      - HP CMOS26G
      - SCN3M_SUBM.40.HP
    feature_size_um: 0.8
    lambda_um: 0.4
    rule_family: scmos_subm
    mosis_codes:
      - SCN3M_SUBM
      - SCN_SUBM
    capabilities:
      - metal3
      - subm
      - silicide_block
      - stacked_via
    source: mosis_scmos_7_2
    magic:
      archive_2001a_techfile: SCN3M_SUBM.40.HP.tech27
      archive_2002a_techfile: SCN3M_SUBM.40.HP.tech27
      exact_process_alias: true
      rich_pex: true
      note: "The HP variant adds fill and stacked-contact grammar and has a full historical Magic extraction block."
    status: historical_reference
  - name: hp_mos14tb
    ncsu_gap_name: HP_GMOS14TB
    vendor_labels:
      - HP MOS14TB
      - HP GMOS14TB
      - AMOS14TB
    feature_size_um: 0.5
    lambda_um: 0.35
    rule_family: scmos
    mosis_codes:
      - SCN3M
      - SCN
      - SCN3MLC
      - SCNLC
    capabilities:
      - metal3
      - linear_capacitor
      - silicide_block
    source: mosis_scmos_7_2
    magic:
      archive_2002a_techfiles:
        - SCN3M.35.tech27
        - SCN3MLC.35.tech27
      exact_process_alias: true
      rich_pex: true
      note: "SCN3MLC is the cap-well/linear-cap variant; SCN3M is the 3M base."
    status: historical_reference
  - name: hp_mos14tb_subm
    ncsu_gap_name: HP_GMOS14TB
    vendor_labels:
      - HP MOS14TB SUBM
      - HP GMOS14TB SUBM
      - AMOS14TB SUBM
    feature_size_um: 0.5
    lambda_um: 0.3
    rule_family: scmos_subm
    mosis_codes:
      - SCN3M_SUBM
      - SCN_SUBM
      - SCN3MLC_SUBM
      - SCNLC_SUBM
    capabilities:
      - metal3
      - subm
      - linear_capacitor
      - silicide_block
      - stacked_via
    source: mosis_scmos_7_2
    magic:
      archive_2002a_techfiles:
        - SCN3M_SUBM.30.tech27
        - SCN3MLC_SUBM.30.tech27
      exact_process_alias: true
      rich_pex: true
      note: "Apply the CMOS14 exact-contact/array policy; do not use a generic oversized-contact shortcut."
    status: historical_reference
  - name: hp_gmos10qa
    ncsu_gap_name: HP_GMOS10QA
    vendor_labels:
      - HP GMOS10QA
    feature_size_um: 0.35
    lambda_um: 0.25
    rule_family: scmos
    mosis_codes:
      - SCN4N
    options:
      - tight_metal
    capabilities:
      - metal4
      - tight_metal
    source: mosis_scmos_7_2
    magic:
      exact_archive_techfile: false
      note: "The MOSIS mapping is confirmed, but the 2001a/2002a archive scan did not locate an exact GMOS10QA/SCN4N target file."
    status: historical_reference
  - name: hp_gmos10qa_subm
    ncsu_gap_name: HP_GMOS10QA
    vendor_labels:
      - HP GMOS10QA SUBM
    feature_size_um: 0.35
    lambda_um: 0.2
    rule_family: scmos_subm
    mosis_codes:
      - SCN4M_SUBM
    options:
      - tight_metal
    capabilities:
      - metal4
      - subm
      - tight_metal
    source: mosis_scmos_7_2
    magic:
      backend_grammar_techfile: SCN4M_SUBM.20.tech27
      backend_header_target_label: TSMC35
      exact_process_alias: false
      note: "SCN4M_SUBM.20 exists in the archive but is labeled TSMC35; use it only as a 4M/SUBM grammar reference until GMOS10QA-specific output and coefficients are sourced."
    status: historical_reference

