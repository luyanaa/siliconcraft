# Historical SCMOS process families and Magic extraction contracts.
# This is a provenance-backed reference matrix, not an active ProcessIR profile.
schema_version: 1
kind: historical_scmos_process_matrix
authority: reference_only
active_profile_policy:
  status: metadata_only
  active_profiles: []
  do_not_claim:
    - calibrated_device_models
    - complete_active_drc_profiles
    - complete_active_lvs_profiles
    - signoff_pex
    - foundry_signoff
  reason: "The public sources expose scalable layer/rule contracts and historical Magic extraction data, but not a complete current foundry-qualified profile for every port."

sources:
  mosis_scmos_7_2:
    url: "https://www.clear.rice.edu/elec422/1999/manual/mosis_scmos7_2.pdf"
    title: "MOSIS Scalable CMOS (SCMOS) Design Rules, version 7.2"
    evidence:
      - "Table 2 defines E, A, 3M, 4M, LC, MEMS, and SUBM options."
      - "Tables 3a and 3b map Orbit, HP CMOS34, HP CMOS26G, AMI CWL, HP GMOS14TB, and HP GMOS10QA to MOSIS codes and lambda."
      - "Table 5 assigns GDS/CIF identifiers for analog, capacitor, CCD, MEMS, silicide, and multi-metal layers."
      - "The CMOS14 contact rule requires exact standard insulator contacts/vias; large openings use arrays."
  southampton_scmos_8_0:
    url: "https://personal.southampton.ac.uk/~bim/notes/ice/DesignRules/scmos-main.html"
    title: "Southampton SCMOS design-rule notes, version 8.0"
    evidence:
      - "Separates logical SCMOS layers from foundry output layers and documents PC poly-cap versus LC cap-well."
      - "Adds 5M/6M, THICK_ACTIVE, SILICIDE_BLOCK, and richer SUBM rule/layer observations."
      - "Records historical DEEP variants; the separate source-backed TSMC DEEP profiles are defined in schema/scmos_process_matrix.yaml, while historical non-TSMC entries here remain reference-only."
  magic_catalog:
    url: "https://opencircuitdesign.com/magic/tech.html"
    title: "Magic Technology Files catalog"
    evidence:
      - "2002a is the last known MOSIS archive release; 2001a is a separate long-used archive set."
      - "The bundled scmos.tech is an obsolete standard scalable-CMOS distribution, not either archive release."
      - "SCMOS rules are conservative integer-lambda abstractions; implicit wells/implants and output styles are not foundry signoff rules."
      - "Distribution files include scmos-sub.tech, scmos-tm.tech, scmosWR.tech, and scmos.tech."
  magic_2001a:
    url: "https://opencircuitdesign.com/magic/archive/2001a.tar.gz"
    title: "Magic SCMOS archive release 2001a"
    role: archive_release
  magic_2002a:
    url: "https://opencircuitdesign.com/magic/archive/2002a.tar.gz"
    title: "Magic SCMOS archive release 2002a"
    role: archive_release
  bundled_magic_source:
    path: "profiles/ls1u/reference/magic/scmos.tech.in"
    title: "Bundled Magic SCMOS source used as a historical/backend reference"
    version: 8.2.8
    role: bundled_distribution_source

magic_release_contract:
  archive_releases_are_distinct:
    - magic_2001a
    - magic_2002a
  bundled_technology_is_distinct: true
  bundled_name: scmos.tech
  bundled_source: "profiles/ls1u/reference/magic/scmos.tech.in"
  required_behavior: "Never treat 2001a or 2002a as aliases for the bundled scmos.tech. Preserve release, file name, target label, and conditional-preprocessor context."
  distribution_files:
    - name: scmos-sub.tech
      url: "https://opencircuitdesign.com/magic/archive/scmos-sub.tech"
      target_labels:
        - HP CMOS26G
        - HP CMOS14B
      feature_sizes_um:
        - 0.8
        - 0.6
      lambda_um:
        - 0.4
        - 0.3
    - name: scmos-tm.tech
      url: "https://opencircuitdesign.com/magic/archive/scmos-tm.tech"
      target_label: tight_metal
      feature_sizes_um:
        - 1.2
        - 1.0
        - 0.7
      lambda_um:
        - 0.6
        - 0.5
        - 0.35
    - name: scmosWR.tech
      url: "https://opencircuitdesign.com/magic/archive/scmosWR.tech"
      target_label: standard_without_well_routing
    - name: scmos.tech
      url: "https://opencircuitdesign.com/magic/archive/scmos.tech"
      target_label: standard_scalable_cmos
      feature_sizes_um:
        - 2.0
        - 1.6
        - 1.2

magic_pex_method:
  purpose: "Carry historical Magic extraction structure into future source-driven manifests without silently promoting it to calibrated process data."
  native_units:
    lambda: centimicron
    sheet_resistance: milliohm_per_square
    area_capacitance: attofarad_per_lambda2
    edge_capacitance: attofarad_per_lambda
    contact_resistance: magic_contact_native_or_milliohm_per_contact
  directive_families:
    - planeorder
    - resist
    - contact
    - areacap
    - overlap
    - perimc
    - sideoverlap
    - sidewall
    - fet
    - fetresis
    - device
  ownership_rules:
    - "Historical Magic comments marked MODEL HANDLES THIS remain model-owned; do not duplicate intrinsic gate or junction terms in PEX."
    - "Metal, poly, well, resistor, overlap, perimeter, sidewall, contact, and route-layer terms are candidates for a source-driven PEX manifest after unit and fixture validation."
    - "A Magic technology file can supply plane/connectivity grammar while coefficients remain from another source; the active AMI16 and HP06 manifests already use this separation."

capabilities:
  analog_npn:
    layers:
      - pbase
      - emitter
      - collector
    magic_types:
      - pbase
      - emit
      - coll
      - npn
    source: mosis_scmos_7_2
  buried_ccd:
    layers:
      - buried_ccd
      - buried_ccd_contact
    magic_types:
      - bd
      - nbd
      - nbdc
    source: mosis_scmos_7_2
  floating_gate:
    magic_types:
      - nffet
      - pffet
      - enfet
      - epfet
    source: bundled_magic_source
  mems:
    layers:
      - mems_open
      - mems_etch_stop
    magic_types:
      - open
      - pstop
      - ppstop
      - pstc
    source: magic_2002a
  electrode_poly2:
    layers:
      - electrode
    magic_types:
      - poly2
      - ecap
      - p2c
    source: mosis_scmos_7_2
  linear_capacitor:
    layers:
      - cap_well
    magic_types:
      - capwell
      - wellcap
      - wcap
    source: mosis_scmos_7_2
  poly_capacitor:
    layers:
      - poly_cap1
    magic_types:
      - polycap
      - cap
    source: southampton_scmos_8_0
  silicide_block:
    layers:
      - silicide_block
    magic_types:
      - sb
      - sblock
    source: southampton_scmos_8_0
  metal3:
    layers:
      - via2
      - metal3
    source: mosis_scmos_7_2
  metal4:
    layers:
      - via3
      - metal4
    source: mosis_scmos_7_2
  stacked_via:
    magic_types:
      - m123c
      - m234c
    source: magic_2002a
  tight_metal:
    magic_deck: scmos-tm.tech
    source: magic_catalog
  subm:
    rule_family: scmos_subm
    source: mosis_scmos_7_2
  high_voltage:
    layers:
      - p_high_voltage
      - n_high_voltage
    magic_types:
      - hnwell
      - hpwell
      - hndiff
      - hpdiff
      - hnfet
      - hpfet
      - hndc
      - hpdc
    source: mosis_scmos_7_2
    note: "SCMOS 7.2 declares CVP/CVN as an undeclared option (AMI ABN only) with no rule section; the only lambda-expressed HV rules are the Magic scmos.tech.in 'AMI 1.5um high-voltage MOSFET' 20.x set. CDK thick-active (CTA/tactive) is a separate high-voltage path."
  thick_active:
    layers:
      - thick_active
    magic_types:
      - tactive
    source: southampton_scmos_8_0
    note: "SCMOS 8.0 gives THICK_ACTIVE a formal rule section (24) for TSMC 4M+; NCSU CDK gates its DBM sanity rules on hvAvailable/tactive."

layers:
  - name: p_high_voltage
    gds_layer: 21
    gds_datatype: 0
    cif: CVP
    magic_type: hpwell
    source: mosis_scmos_7_2
    note: "High-voltage p-type marker layer; no SCMOS 7.2 rule section."
  - name: n_high_voltage
    gds_layer: 22
    gds_datatype: 0
    cif: CVN
    magic_type: hnwell
    source: mosis_scmos_7_2
    note: "High-voltage n-type marker layer; no SCMOS 7.2 rule section."
  - name: mems_open
    gds_layer: 23
    gds_datatype: 0
    cif: COP
    magic_type: open
    source: mosis_scmos_7_2
  - name: mems_etch_stop
    gds_layer: 24
    gds_datatype: 0
    cif: CPS
    magic_type: pstop
    source: mosis_scmos_7_2
  - name: poly_cap1
    gds_layer: 28
    gds_datatype: 0
    cif: CPC
    magic_type: polycap
    source: mosis_scmos_7_2
  - name: silicide_block
    gds_layer: 29
    gds_datatype: 0
    cif: CSB
    magic_type: sb
    source: southampton_scmos_8_0
  - name: via3
    gds_layer: 30
    gds_datatype: 0
    cif: CVT
    magic_type: m3contact
    source: mosis_scmos_7_2
  - name: metal4
    gds_layer: 31
    gds_datatype: 0
    cif: CMQ
    magic_type: metal4
    source: mosis_scmos_7_2
  - name: via2
    gds_layer: 61
    gds_datatype: 0
    cif: CVS
    magic_type: m2contact
    source: mosis_scmos_7_2
  - name: metal3
    gds_layer: 62
    gds_datatype: 0
    cif: CMT
    magic_type: metal3
    source: mosis_scmos_7_2
  - name: thick_active
    gds_layer: 60
    gds_datatype: 0
    cif: CTA
    magic_type: thick_active
    source: southampton_scmos_8_0
  - name: cap_well
    gds_layer: 59
    gds_datatype: 0
    cif: CWC
    magic_type: capwell
    source: mosis_scmos_7_2
  - name: buried_ccd
    gds_layer: 57
    gds_datatype: 0
    cif: CCD
    magic_type: bd
    source: mosis_scmos_7_2
  - name: pbase
    gds_layer: 58
    gds_datatype: 0
    cif: CBA
    magic_type: pbase
    source: mosis_scmos_7_2
  - name: electrode
    gds_layer: 56
    gds_datatype: 0
    cif: CEL
    magic_type: poly2
    source: mosis_scmos_7_2

# SCMOS 7.2 option rule families: three-way status contract.
#   defined       = layer/option declared in SCMOS 7.2 (Tables 2/5)
#   lambda_rules  = full lambda rule tables exist in SCMOS 7.2
#   drc_status    = none | lambda_only | implemented | partial
#   lvs_status    = none | recipe | implemented | not_applicable | partial
# Reference analysis: docs/scmos72_device_extensions.md
option_rule_families:
  - id: electrode_capacitor
    name: "Electrode capacitor (poly2 over poly1)"
    option_codes: [E, A]
    rule_sections: [11]
    layers: [electrode]
    defined: true
    lambda_rules: true
    drc_status: implemented
    lvs_status: implemented
    sources: [mosis_scmos_7_2, bundled_magic_source]
    rule_summary: "11.1 width 3; 11.2 spacing 3; 11.3 poly overlap 2; 11.4 active/well edge 2; 11.5 poly contact 3."
    native_evidence: "Magic scmos.tech.in DRC 11.x; SCNA20(ORB) `device capacitor None cap,capc/a poly,pc 120 735`; CDK CapacitorElec."
    siliconcraft: "rules.yaml 11.x present for ami06/ami16; devices.yaml CapacitorElec; PEX elec_poly sourced (N88Z 596 aF/um2)."
    caveats:
      - "Magic implements 11.1 at 2 lambda (techfile comment: risking a little for floating-gate overlaps)."
      - "SCMOS 8.0 SUBM deltas: 11.1 3->7, 11.3 2->5, 11.5 3->6."
  - id: electrode_transistor
    name: "Electrode-gated MOS transistor"
    option_codes: [E, A]
    rule_sections: [12]
    layers: [electrode]
    defined: true
    lambda_rules: true
    drc_status: implemented
    lvs_status: implemented
    sources: [mosis_scmos_7_2, bundled_magic_source]
    rule_summary: "12.1 width 2; 12.2 spacing 3; 12.3 gate overlap of active 2; 12.4 active spacing 1; 12.5 poly spacing/overlap 2; 12.6 poly/active contact spacing 3."
    native_evidence: "Magic DRC 12.x; `fet enfet/epfet` in SCNA20(ORB); CDK nmos4_elec/pmos4_elec."
    siliconcraft: "rules.yaml 12.1 present; devices.yaml nmos4_elec/pmos4_elec (ami16)."
    caveats:
      - "Allowed as gate only on 1.5um-family processes (SCMOS 8.0); AMI C5N and TSMC035 forbid elec/active overlap (DBM Rule 4.0)."
  - id: electrode_contact
    name: "Electrode contact"
    option_codes: [E, A]
    rule_sections: [13]
    layers: [electrode]
    defined: true
    lambda_rules: true
    drc_status: implemented
    lvs_status: implemented
    sources: [mosis_scmos_7_2, bundled_magic_source]
    rule_summary: "13.1 contact 2x2; 13.2 spacing 2; 13.3 electrode overlap on capacitor 3; 13.4 elsewhere 2; 13.5 poly/active spacing 3."
    native_evidence: "Magic DRC 13.x; contact layer shared with CCG."
    siliconcraft: "rules.yaml 13.1 present; elecRes in devices.yaml."
    caveats: []
  - id: vertical_npn
    name: "Vertical NPN bipolar transistor"
    option_codes: [A]
    rule_sections: [16]
    layers: [pbase]
    defined: true
    lambda_rules: true
    drc_status: implemented
    lvs_status: implemented
    sources: [mosis_scmos_7_2, bundled_magic_source]
    rule_summary: "16.1 contact 2x2; 16.2 emitter select overlap of contact 3; 16.3 pbase overlap of emitter select 2; 16.4 emitter/base select spacing 4; 16.5 pbase overlap of base select 2; 16.6 base select overlap of contact 2; 16.7 nwell overlap of pbase 6; 16.8 pbase to collector active 4; 16.9 collector active overlap of contact 2; 16.10 nwell overlap of collector active 3; 16.11 select overlap of collector active 2."
    native_evidence: "Magic DRC 16.x (16.3 checked at 4 due to 2-lambda emitter-select CIF expansion); SCNA20(ORB) `device bjt npn emit,emc/a pbase,pbc/a nwell`; CDK Generic_NPN."
    siliconcraft: "LVS implemented (npnTran -> Generic_NPN); rules.yaml 16.x present for AMI16 with derived-layer region checks; NPN model cards remain source-reference only."
    caveats:
      - "Magic extension rules for pbase resistors (width 2, spacing 2, rev 8.2.4) are NOT official SCMOS; keep source label."
      - "Collector width checked via `width col,clc/a 6` instead of an explicit 16.9 check."
  - id: linear_capacitor
    name: "Linear capacitor (LC cap-well)"
    option_codes: [LC]
    rule_sections: [17, 18]
    layers: [cap_well]
    defined: true
    lambda_rules: true
    drc_status: implemented
    lvs_status: implemented
    sources: [mosis_scmos_7_2, bundled_magic_source]
    rule_summary: "17.1 width 10 [SUBM 12]; 17.2 spacing 9 [SUBM 18]; 17.3 external active 5 [SUBM 6]; 17.4 active overlap 5 (CMOS34: 3) [SUBM 6]; 18.1 width 3; 18.2 poly extension of active 1/2; 18.3 active overlap of poly 3; 18.4 poly contact to active 2; 18.5 active contact to poly 4/6."
    native_evidence: "Magic DRC 17.x/18.x (HP 1.2um linear-cap process); SCN12LC(HP) `fet wcap ndiff,ndc 1 wcap GND! 300 0` and SCNA20(ORB) `device capacitor None wcap ndiff,ndc 300 0`."
    siliconcraft: "devices.yaml lcCap (HP06, cwell-gated); rules.yaml 17.x/18.x present for HP06 with SUBM values; capacitance coefficients remain profile-owned."
    caveats:
      - "CMOS34 vs CMOS14 dual values: 17.4 (3/5), 18.2 (1/2), 18.5 (4/6); small values CMOS34-only."
      - "Magic comments 18.5/18.6 as conservative."
  - id: buried_ccd
    name: "Buried-channel CCD"
    option_codes: [A]
    rule_sections: [19]
    layers: [buried_ccd]
    defined: true
    lambda_rules: true
    drc_status: implemented
    lvs_status: not_applicable
    sources: [mosis_scmos_7_2, bundled_magic_source]
    rule_summary: "19.1 channel active width 4; 19.2 spacing 4; 19.3 CCD implant overlap of channel active 2; 19.4 outside contact to CCD implant 3; 19.5 select overlap of electrode/poly 2; 19.6 poly/electrode overlap in channel 2; 19.7 contact to channel electrode 2."
    native_evidence: "Magic DRC 19.x plus two extension checks (nbdc-poly/el 1; nbd missing-bd). CIF in/out only; no device extraction."
    siliconcraft: "ccdAvailable flag exists; rules.yaml 19.x MISSING (gap); LVS not applicable (charge-coupled device, not a terminal device)."
    caveats:
      - "2um analog option only (Orbit/AMI ABN)."
  - id: silicide_block
    name: "Silicide block / unsilicided poly resistor"
    option_codes: []
    rule_sections: [20]
    layers: [silicide_block]
    defined: true
    lambda_rules: true
    drc_status: lambda_only
    lvs_status: recipe
    sources: [mosis_scmos_7_2, southampton_scmos_8_0]
    rule_summary: "20.1 SB width 4; 20.2 SB spacing 4; 20.3 SB to contact 2 (no contacts inside SB); 20.4 external active 2; 20.5 external poly 2; 20.6 resistor = poly in SB, contacts outside well over field; 20.7 poly width 5; 20.8 resistor spacing in one SB 7; 20.9 SB overlap of poly 2."
    native_evidence: "Undeclared option with full rule section. Bundled Magic techfile has rnfet/rpfet (poly gate without silicide) and poly_resist stripes but no CSB DRC; 2002a SCN3MLC/SCN3MLC_SUBM decks carry a silicide_block method."
    siliconcraft: "devices.yaml polySRes (HP06, sblock-gated); rules.yaml 20.x present as lambda-only geometry checks; sheet resistance and foundry signoff remain separate."
    caveats:
      - "IIT HTML variant renumbers 20.6-20.9 to 20.11-20.14 and adds ESD rules 20.6-20.10; use PDF numbering as authority."
      - "SCMOS 8.0 extends SILICIDE_BLOCK to TSMC 4M/5M/6M (rule section 20)."
  - id: scnpc_poly_cap
    name: "SCNPC poly capacitor (POLY_CAP1)"
    option_codes: [SCNPC]
    rule_sections: [23]
    layers: [poly_cap1]
    defined: true
    lambda_rules: true
    drc_status: lambda_only
    lvs_status: none
    sources: [mosis_scmos_7_2, southampton_scmos_8_0]
    rule_summary: "23.1 POLY_CAP1 width 8 (real capacitor >12); 23.2 CPC spacing 4; 23.3 CPC to ACTIVE 8 (over field only); 23.4 CPC over POLY 3; 23.5 CPC over CONTACT 2; 23.6 POLY over CONTACT (in capacitor) 2; 23.7 POLY to CPC-contact 2; 23.8 unrelated METAL1 to CPC 4; 23.9 METAL2 to CPC 2."
    native_evidence: "Distinct technology code (AMI CWL 0.8um, lambda 0.5). No public native deck; no Magic SCNPC/CPC target found."
    siliconcraft: "devices.yaml polycapCap entry (ami06, polycapAvailable=false); rules.yaml 23.x MISSING (gap); LVS none until AMI CWL native evidence appears."
    caveats:
      - "Never model SCNPC as SCNLC/cap-well or as Magic `cap` (poly2-poly1 electrode cap); three distinct capacitor semantics."
      - "Capacitor may not straddle a well boundary; only connecting METAL1 may cross."
  - id: hvcmos
    name: "High-voltage MOSFET (undeclared option)"
    option_codes: []
    rule_sections: []
    layers: [p_high_voltage, n_high_voltage]
    defined: true
    lambda_rules: false
    drc_status: none
    lvs_status: partial
    sources: [mosis_scmos_7_2, bundled_magic_source]
    rule_summary: "SCMOS 7.2 has NO HV rule section; no lambda rules are implemented by default. The only lambda-expressed HV set is the Magic scmos.tech.in 'AMI 1.5um high-voltage MOSFET' 20.x (HV well spacing 12 diff-potential; HV diffusion spacing 5; HV diff to well edge 7; HV N/P diff 14; HV to normal diff 12; ohmic to opposite HV well 3; poly1 forbidden as HV gate via compose; HV diffusion contact width 6; HV channel length >= 4), available only under an explicit override."
    lambda_implementation:
      default: none
      policy: override_required
      override:
        id: hvcmos_magic20_lambda
        label: "Magic scmos.tech.in AMI 1.5um high-voltage MOSFET rules 20.x applied as lambda"
        feature_flag: hvcmosLambdaOverride
        required_acknowledgements:
          - "HVCMOS is an undeclared SCMOS 7.2 option with no official rule section; the 20.x set is not SCMOS 7.2 rules."
          - "The 20.x rules are process-specific to the Magic 'AMI 1.5 micron' high-voltage branch and are not generically lambda-scalable."
          - "No public voltage rating (e.g. '12V') is substantiated by SCMOS 7.2."
          - "CVP/CVN (GDS 21/22) remain marker layers; no spacing rules are inferred for them."
    native_evidence: "Magic compose rules derive hnfet/hpfet = poly2 AND HV diffusion; no `fet hnfet/hpfet` extraction directive in the bundled techfile. NCSU CDK high-voltage path uses thick active (tactive/CTA) with DBM Rule 5.0 and nmos_hv/pmos_hv LVS suffixes (Nhv/Phv)."
    siliconcraft: "No HVCMOS lambda rules. hvAvailable flag is wired to tactive in scmos_layers.py; LVS core MODEL_SUFFIX has Nhv/Phv; CVP/CVN layers are registered as markers only; rules.yaml entries with family: hvcmos require the hvcmosLambdaOverride feature (enforced by common/process_ir.py)."
    caveats:
      - "CVP/CVN are marker layers only: do not invent spacing rules for them."
      - "Voltage rating (e.g. '12V') is not substantiated by any public SCMOS 7.2 source."
      - "Magic labels the rules 'AMI 1.5 micron' while MOSIS Table 3a says AMI ABN 1.2um; CDK calls ami16 'AMI 1.6u ABN'. Preserve original labels."
  - id: mems
    name: "MEMS micromachining (mems_open / mems_etch_stop)"
    option_codes: [_MEMS]
    rule_sections: []
    layers: [mems_open, mems_etch_stop]
    defined: true
    lambda_rules: false
    drc_status: none
    lvs_status: none
    sources: [mosis_scmos_7_2, magic_2002a]
    rule_summary: "No rule section. Magic scmos.tech.in: 'there is no rules enforced by Magic. Designers aimed at micromachining devices must do DRC themselves' (Marshall 1992)."
    native_evidence: "SCNA_MEMS option on Orbit 2.0um only. Process guidelines in microns, not lambda: etch-stop ring typically 8-10 um (MOSIS newsletter 206); NIST IR 5402 records open/etch-stop tiles. Orbit later changed opening processing (Warneke 2000)."
    siliconcraft: "memsAvailable flag exists; CDK layer map carries open(23)/pstop(24); no DRC/LVS."
    caveats:
      - "Historical process documentation, not a guarantee for later Orbit runs."
  - id: tight_metal
    name: "Tight metal rule (undeclared option)"
    option_codes: []
    rule_sections: []
    layers: []
    defined: true
    lambda_rules: true
    drc_status: implemented
    lvs_status: not_applicable
    sources: [mosis_scmos_7_2, magic_catalog]
    rule_summary: "Table 4: metal1 spacing 3->2, metal2 spacing 4->3, metal3 spacing 4->4 (min-width wire pairs only); well/poly/contact unchanged."
    native_evidence: "scmos-tm.tech."
    siliconcraft: "Recorded in rule_overlays.tight_metal."
    caveats: []
  - id: triple_metal
    name: "Triple metal (via2 + metal3)"
    option_codes: [3M]
    rule_sections: [14, 15]
    layers: [via2, metal3]
    defined: true
    lambda_rules: true
    drc_status: implemented
    lvs_status: not_applicable
    sources: [mosis_scmos_7_2]
    rule_summary: "14.1 via2 2x2; 14.2 spacing 3; 14.3 metal2 overlap 1; 14.4 via1 spacing 2; 14.5 may stack over contact; 15.1 metal3 width 6 [SUBM 5]; 15.2 spacing 4 [SUBM 3]; 15.3 via2 overlap 2."
    native_evidence: "Magic SCN3M/SCN08 styles; CDK metal3Available rules."
    siliconcraft: "rules.yaml 14.1/15.1 with metal3/metal4 conditions."
    caveats: []
  - id: quad_metal
    name: "Quad metal (via3 + metal4; SUBM only)"
    option_codes: [4M]
    rule_sections: [21, 22]
    layers: [via3, metal4]
    defined: true
    lambda_rules: true
    drc_status: lambda_only
    lvs_status: not_applicable
    sources: [mosis_scmos_7_2]
    rule_summary: "21.1 via3 2x2; 21.2 spacing 4; 21.3 metal3 overlap 1; 22.1 metal4 width 6; 22.2 spacing 6; 22.3 via3 overlap 2. In 4M option metal3 becomes thin: 15.1=3, 15.3=1."
    native_evidence: "Magic SCN4M_SUBM.20 (TSMC35-labeled) grammar only; no process-specific coefficients."
    siliconcraft: "metal4 rules for ams_c35 (metal4Available)."
    caveats: []

rule_overlays:
  standard:
    lambda_convention: "Historically one half of minimum gate length."
    source: magic_catalog
    integer_lambda_contract:
      minimum_gate_length_lambda: 2
      minimum_metal_width_lambda: 3
      minimum_diffusion_width_lambda: 3
      minimum_contact_size_lambda: 4
  tight_metal:
    source: mosis_scmos_7_2
    magic_source: scmos-tm.tech
    differences_from_standard:
      - rule: metal1_spacing
        standard_lambda: 3
        tight_metal_lambda: 2
      - rule: metal2_spacing
        standard_lambda: 4
        tight_metal_lambda: 3
      - rule: metal3_spacing
        standard_lambda: 4
        tight_metal_lambda: 4
  subm:
    source: mosis_scmos_7_2
    differences_from_standard:
      - rule: well_width
        standard_lambda: 10
        subm_lambda: 12
      - rule: well_spacing_different_potential
        standard_lambda: 9
        subm_lambda: 18
      - rule: well_overlap_transistor
        standard_lambda: 5
        subm_lambda: 6
      - rule: poly_spacing
        standard_lambda: 2
        subm_lambda: 3
      - rule: contact_spacing
        standard_lambda: 2
        subm_lambda: 3
      - rule: via_on_flat
        standard_lambda: 2
        subm_lambda: unrestricted
      - rule: metal2_spacing
        standard_lambda: 4
        subm_lambda: 3
      - rule: metal3_width
        standard_lambda: 6
        subm_lambda: 5
      - rule: metal3_spacing
        standard_lambda: 4
        subm_lambda: 3
    extended_observations:
      - "Southampton SCMOS 8.0 records wider SUBM metal spacing and substantially different poly2/electrode rules."
      - "SUBM is a rule-family choice; it is not a license to import DEEP variants."
  hp_cmos14_contact_policy:
    source: mosis_scmos_7_2
    requirements:
      - "Insulator contacts and vias use the exact standard contact size."
      - "Pads and large openings use arrays; do not infer a single oversized contact."

