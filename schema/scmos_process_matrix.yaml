deep_rule_boundary:
  status: explicit_source_backed_only
  supported_profiles:
    - tsmc025_deep
    - tsmc018_deep
  source_contract:
    - "NCSU CDK globalData.il process metadata"
    - "NCSU CDK tsmc_03d.tf / tsmc_02d.tf feature flags"
    - "NCSU CDK techfile/divaDRC.rul DEEP branches"
    - "NCSU CDK publicModel tsmc25dN/P and tsmc18dN/P"
  do_not_infer:
    - "A generic 130nm SCMOS_DEEP profile from node size alone"
    - "TSMC PEX coefficients from a model card or lambda value"
    - "Foundry signoff DRC/LVS from the shared reference deck"
forbidden:
  process_names: []
  mosis_codes: []
  techfiles: []
  lambda_um: []
