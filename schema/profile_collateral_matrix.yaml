# Source-driven collateral coverage for every materialized process profile.
# This matrix is an availability contract, not a signoff claim.
schema_version: 1
kind: profile_collateral_matrix
profile_discovery: profiles/*/layers.yaml
policy:
  source_rule: "Use local reports and bundled/public source files first; missing coefficients remain explicit null/blocked values."
  xschem_symbols: "Every materialized profile must provide a symbols.yaml UI contract and devices/symbol_netlist.yaml identity contract."
  spice_devices: "Every device identity must resolve to a simulator library or an explicit contract_only model record; contract_only is not simulation-ready."
  extraction: "Every profile must name one primary Magic PEX, field-solver, public-R-only, or deferred route; automatic inference across processes is forbidden."
  signoff: false
  unknown_policy: "Unknown contact, via, junction, substrate, corner, and calibration values remain unknown; they are never guessed."
promotion_rules:
  general_default:
    required:
      - drc
      - lvs
      - xschem_symbol_contract
      - xschem_ngspice_smoke
      - simulatable_spice_models
      - source_reference_pex
      - runtime_pex_fixture
    forbidden:
      - contract_only_model
      - topology_only_extraction
      - field_solver_only_extraction
      - deferred_extraction
      - signoff_claim
    note: "The default remains an engineering bootstrap, not a foundry signoff technology."
defaults:
  general:
    profile: ami06
    reason: "AMI06 is the integrated engineering bootstrap path with source-backed DRC/LVS, nominal SPICE, xschem/ngspice smoke, native Magic PEX, and the existing conformance gates; AMI16 and HP06 remain source-backed alternates because their process-specific device/row/corner contracts are narrower."
    signoff: false
  source_backed_scmos_alternates:
    - ami16
    - hp06
  field_solver_default: none
profiles:
  ami06:
    promotion: general_default
    sources:
      - NCSU_CDK_1.6.0
      - MOSIS_N8BN_report
      - local_model_card
    xschem: {status: source_backed, symbols: profiles/ami06/symbols.yaml, netlist: profiles/ami06/devices/symbol_netlist.yaml, smoke: profiles/ami06/xschem_smoke.yaml}
    spice:
      status: simulatable_nominal
      library: profiles/ami06/models/ami06.lib
      sections:
        - ami06
      devices:
        - ami06N
        - ami06P
      corners:
        - nominal
    extraction: {route: magic_pex, manifest: profiles/ami06/pex/manifest.yaml, profile: n8bn_reference, status: source_reference_partial, topology: true, runtime: true, rc: estimated}
    field_solver: {status: not_required, calibrated: false}
