# profiles/ls1u/layers.yaml — normalized from LibreSilicon ls1u.xml
# Source: leviathanch/libresiliconprocess @ ac381a1e2b76b5c8882e82978c6f594a597df616
meta:
  name: ls1u
  process: LS1U
  foundry: LibreSilicon
  description: "LibreSilicon 1um twin-well CMOS with STI specification"
  node_um: 1.0
  lambda_um: 0.5
  grid_um: 0.5
  min_channel_um: 0.5
  min_width_um: 1.5
  model_prefix: ls1u
  well_type: e
  rule_family: native
  stacked_vias: false
  # The stdcell renderer works in SCMOS token names (NSELECT/PSELECT/CC/VIA12).
  # LS1u draws the same physical layers under its own names, so map them here
  # rather than teaching every consumer about this process's vocabulary.
  stdcell_physical_layers:
    NSELECT: nimplant
    PSELECT: pimplant
    CC: contact
    CP: contact
    VIA12: via1
    VIA23: via2
  features:
    twinWellAvailable: true
    shallowTrenchIsolation: true
    metal3Available: true
    metal4Available: true
    metal5Available: true
    metal6Available: true
    npnAvailable: false
    pnpAvailable: false
    sonosAvailable: false
    pbaseAvailable: false
    nbaseAvailable: false
    bipolarModelsAvailable: false
  license: "Libre Silicon public license v1-or-later (source-referenced; license text not present in upstream repository)"
  sources:
    - "https://github.com/leviathanch/libresiliconprocess@ac381a1e2b76b5c8882e82978c6f594a597df616/magic/ls1u.xml"
    - "https://github.com/leviathanch/libresiliconprocess@ac381a1e2b76b5c8882e82978c6f594a597df616/process_design_rules/process_design_rules.tex"
