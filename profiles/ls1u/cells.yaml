# LS1u fixed-height stdcell geometry candidate.
#
# Derived, not signoff.  Every dimension comes from this profile's own rule
# table (profiles/ls1u/rules.yaml), using the same derivation the existing
# contracts follow:
#   p row   = nwell.min_width + 2 * nwell.active_enclosure   (exact for ami06,
#             ams_c35, hp06 and tsmc035_4m2p)                = 5.0 + 2*3.0 = 11.0
#   n row   = active.min_width + 2 * gate.extension + 2 * contact.cut_size
#             (matches the ami06/hp06 branch)                = 1.5 + 2*1.0 + 2*1.0 = 5.5,
#             rounded up to 6.0 so the row centre lands on the 0.5um grid:
#             rail 1.5 + 6.0/2 = 4.5, and 9.0 + 11.0/2 = 14.5 for the p row.  An
#             odd 5.5 row would centre devices at 4.25, which its own
#             LS1U.0.*_GRID rules reject.
#   row gap = max(active.min_width, metal.M1.min_spacing)   = max(1.5, 2.0) = 2.0
#             For every other contract these two rules coincide (SCMOS M1 spacing
#             equals the 3-lambda active width), so the gap is the same value
#             either way.  Here they differ: LS1u's M1 spacing is 2.0 while its
#             active width is 1.5, and the M1 power rails sit across the row gap,
#             so a 1.5 gap violates LS1U.2.7.2 (observed as a real DRC marker).
#   rail    = max(active.min_width, metal.M1.min_width)     = max(1.5, 2.0) = 2.0
#             Every other contract has rail >= M1 width (ami06 1.5/0.9,
#             ams_c35 0.6/0.6, hp06 1.5/0.9, tsmc035_4m2p 0.6/0.6, tsmc018_deep
#             0.27/0.27, tsmc025_deep 0.36/0.36), so the power rail sits inside
#             its margin band.  LS1u's M1 is 2.0 wide against a 1.5 margin, so
#             the rail overhung into the row and left only 1.5um to the first M1
#             pad -- LS1U.2.7.2 needs 2.0.
# Site = gap + n + p + 2 * rail = 2.0 + 6.0 + 11.0 + 4.0 = 23.0um, on grid.
#
# LS1u is a 1um-node reference process; this is a geometry candidate, not a
# foundry standard-cell library or a signoff row contract.
schema_version: 1
profile: ls1u
stdcell:
  geometry_status: derived_candidate_not_signoff
  geometry_basis:
    - profiles/ls1u/layers.yaml
    - profiles/ls1u/rules.yaml
    - profiles/ls1u/reference/klayout/ls1u.lydrc
    - shared SCMOS row derivation (see profiles/ams_c35/cells.yaml)
  site_height_um: 23.0
  row_heights_um:
    n: 6.0
    p: 11.0
  row_gap_um: 2.0
  rail_margin_um: 2.0
  tap_policy: self_tapped
  tapcell:
    required: false
    cell: TAPCELL
    max_spacing_um: null
  orientations:
    even_row: R0
    odd_row: MX
    legal:
      - R0
      - MX
  verification:
    # LS1u's DRC authority is its own native KLayout deck, not the generated
    # SCMOS authoritative deck.
    drc_deck: reference
    lvs_deck: reference
    # Both gates pass: DRC markers=0, LVS match.
    #   DRC  0 markers on ls1u's own LS1U.* rules
    #   LVS  2 devices vs 2, 6 nets vs 6, ports A Y VDD VSS NWELL PWELL
    # The native lylvs deck originally extracted no signal ports (it declared no
    # label layer and left make_top_level_pins commented out).  It now reads the
    # pin text from stream 64/0 -- the same stream
    # common/lvs/scmos_lvs_core.py uses as TEXT_GDS -- and, importantly, connects
    # that text layer into the net graph before declaring labels(), because
    # KLayout only attaches a label to a net whose geometry lies under the text.
    lvs_port_extraction: verified
    lvs_port_note: "native deck reads pin text from 64/0 and promotes named nets to ports; see the deck's port-extraction block"
