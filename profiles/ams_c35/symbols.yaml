# profiles/ams_c35/symbols.yaml — xschem symbols for the supported C35 core
#
# UI geometry is kept separate from devices/symbol_netlist.yaml.  Pins are
# emitted in declaration order and therefore match the canonical D/G/S/B
# primitive order used by the C35 model card and LVS contract.

symbols:
  nmos4:
    kind: fet
    type: nmos
    pins:
      - {name: d, dir: inout, x1: 17.5, y1: -32.5, x2: 22.5, y2: -27.5}
      - {name: g, dir: in, x1: -22.5, y1: -2.5, x2: -17.5, y2: 2.5}
      - {name: s, dir: inout, x1: 17.5, y1: 27.5, x2: 22.5, y2: 32.5}
      - {name: b, dir: in, x1: 17.5, y1: -2.5, x2: 22.5, y2: 2.5}
  pmos4:
    kind: fet
    type: pmos
    pins:
      - {name: d, dir: inout, x1: 17.5, y1: -32.5, x2: 22.5, y2: -27.5}
      - {name: g, dir: in, x1: -22.5, y1: -2.5, x2: -17.5, y2: 2.5}
      - {name: s, dir: inout, x1: 17.5, y1: 27.5, x2: 22.5, y2: 32.5}
      - {name: b, dir: in, x1: 17.5, y1: -2.5, x2: 22.5, y2: 2.5}
  vdc:
    kind: src
    type: vsource
    pins:
      - {name: p, dir: inout, x1: -2.5, y1: -32.5, x2: 2.5, y2: -27.5}
      - {name: m, dir: inout, x1: -2.5, y1: 27.5, x2: 2.5, y2: 32.5}
  gnd:
    kind: gnd
    type: label
    global: true
    pins:
      - {name: p, dir: inout, x1: -2.5, y1: -2.5, x2: 2.5, y2: 2.5}
  lab_pin:
    kind: lab_pin
    type: label
    pins:
      - {name: p, dir: in, x1: -1.25, y1: -1.25, x2: 1.25, y2: 1.25}
