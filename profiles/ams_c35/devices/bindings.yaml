# Process-specific binding of the canonical MOS contract to ams C35.
# Simulation cards are the ENG-182 REV_6 BSIM3v3 models transcribed from the
# USP thesis appendix (models/ams_c35.lib, generated by gen_models.py):
# primitive M instances with c35N/c35P model names matching the LVS output.
schema_version: 1
canonical_source: "../../../common/devices/canonical/mos.yaml"
bindings:
  nmos_core:
    canonical_variant: nmos_core
    layout:
      gate_types: nfet
      terminal_types: "ndiff,ndc"
      substrate_types: pwell
      substrate_node: Gnd!
    simulation:
      representation: primitive
      name: c35N
      prefix: m
      model_library: "../models/ams_c35.lib"
      parameter_map:
        w: w
        l: l
        nf: nf
        m: m
        ad: ad
        as: as
        pd: pd
        ps: ps
    lvs:
      extracted_class: c35N
      netgen_class: c35N
      permutable:
        -
          - d
          - s
  pmos_core:
    canonical_variant: pmos_core
    layout:
      gate_types: pfet
      terminal_types: "pdiff,pdc"
      substrate_types: nwell
      substrate_node: Vdd!
    simulation:
      representation: primitive
      name: c35P
      prefix: m
      model_library: "../models/ams_c35.lib"
      parameter_map:
        w: w
        l: l
        nf: nf
        m: m
        ad: ad
        as: as
        pd: pd
        ps: ps
    lvs:
      extracted_class: c35P
      netgen_class: c35P
      permutable:
        -
          - d
          - s
