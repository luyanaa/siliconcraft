# Process-specific C35 device bindings.
# Core MOS cards are ENG-182 REV_6 BSIM3v3 models transcribed from the USP
# thesis appendix (models/ams_c35.lib, generated by gen_models.py).
schema_version: 1
canonical_source: "../../../common/devices/canonical/mos.yaml"
