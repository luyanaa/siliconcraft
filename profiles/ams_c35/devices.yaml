# C35B4C3 primitive recognition and terminal extraction. RNWELL is an n-well
# JFET, not a three-terminal resistor. Missing compact cards fail closed in PEX.
devices:
  mos4:
    - {name: nmos4, channel: nChannel, diff: nDiff, bulk_net: substrate, model_suffix: nmos}
    - {name: pmos4, channel: pChannel, diff: pDiff, bulk_net: nBulk, model_suffix: pmos}
    - {name: nmosm, channel: nChannelM, diff: nDiff, bulk_net: substrate, model_name: MODNM}
    - {name: pmosm, channel: pChannelM, diff: pDiff, bulk_net: nBulk, model_name: MODPM}
  resistor:
    - {name: rp2, body: elecRes, terminal_marker: restdm, terminal_layer: elec, sheet: rp2}
    - {name: rph, body: elecHighres, terminal_marker: pselect, terminal_layer: elec, terminal_gap_um: 0.35, sheet: highres}
    - {name: rdiffn, body: rdiffnRegion, terminal_marker: restdm, terminal_layer: nDiff, sheet: n_diff}
    - {name: rdiffp, body: rdiffpRegion, terminal_marker: restdm, terminal_layer: pDiff, sheet: p_diff}
  jfet:
    - {name: rnwell, region: nwellRes}
  capacitor:
    - {name: PiPCap, region: polyElecCap, top: elec, bottom: poly, area_cap: c35_pip}
  diode:
    - {name: subdiode, region: NPdiode, plus: substrate, minus: nDiff, model_name: ND}
    - {name: welldiode, region: PNdiode, plus: pDiff, minus: nBulk, model_name: PD}
    - {name: nwd, region: NwPdiode, plus: substrate, minus: nBulk, model_name: NWD}
