# HP06 PEX profiles.  Coefficients are sourced from the NCSU CDK
# HP_AMOS14TB branch; the Magic SCMOS file is only the backend grammar and
# connectivity carrier.  This is not a signoff deck.
schema_version: 2
profile: hp06
default: none
flow:
  backend: magic
  source_driven: true
  original_process: HP_AMOS14TB
  original_run: N8AG
  topology_source: "NCSU CDK 1.6.0 techfile/divaEXT.rul extractMOS"
  capacitance_source: "NCSU CDK 1.6.0 techfile/layerDefinitions.tf"
  contact_policy: "contact/via resistance emitted per cut from the MOSIS N8AG parametric test report; junction/substrate capacitance remains withheld pending a Magic-safe mapping"
  parasitic_ownership:
    transistor_intrinsic_capacitance: model
    gate_overlap_capacitance: model
    junction_area_capacitance: model
    junction_sidewall_capacitance: model
    diffusion_sheet_resistance: pex
    gate_sheet_resistance: pex
    metal_interconnect_rc: pex
physical:
  lambda_um: 0.3
  magic_lambda_centimicron: 30
  magic_resistance_unit: "milliohm_per_square"
  magic_area_cap_unit: "attofarad_per_lambda2"
  magic_edge_cap_unit: "attofarad_per_lambda"
source_technology:
  file: "../../ls1u/reference/magic/pearlriver-scmos.tech"
  gds_input_map: "../reference/magic/cifin-hp06.gen"
  legacy_backend:
    technology: "scmos-sub"
    extraction_style: "lambda=0.30"
    expected_lambda_um: 0.3
    purpose: "runtime SCMOS geometry/connectivity cross-check only; not the HP06 coefficient source"
    source: "OpenCircuitDesign Magic scmos-sub.tech / MOSIS SCMOS 8.2.8"
  backend_aliases:
    sblock: "rpoly"
    cwell_cap: "wcap"
  note: "SCMOS file supplies Magic's internal plane/connect grammar only; HP06 GDS input and extract sections replace its process semantics. The matched scmos-sub backend is selected only by the legacy cross-check gate."
topology_fragment: "../reference/magic/extract_topology.tech.in"
technology:
  description: "HP_AMOS14TB N8AG source-reference PEX (extraction scope only)"
topology:
  features:
    cwell: true
    sblock: true
    metal3: true
    stacked_vias: true
  style: hp06_n8ag
  cscale: 1
  step: 100
  sidehalo: 8
  magic_device_class: mosfet
  magic_terminal_order: "drain,gate,source,bulk"
  plane_order:
    -
      - active
      - 0
    -
      - well
      - 1
    -
      - implant
      - 2
    -
      - metal1
      - 3
    -
      - metal2
      - 4
    -
      - metal3
      - 5
    -
      - oxide
      - 6
  device_semantics:
    mos4:
      - nmos4
      - pmos4
    resistor:
      - polyRes
      - polySRes
      - nwellRes
    capacitor:
      - lcCap
    diode:
      - NPdiode
      - PNdiode
      - NwPdiode
  scope: "HP06 nmos4/pmos4 primitive MOS plus explicitly sourced tier-L0 route RC"
profiles:
  none:
    generated: true
    status: topology_only
    description: "HP06 layer map and primitive MOS topology without PEX coefficients."
    magic_directives: []
  n8ag_reference:
    generated: true
    status: source_reference_partial
    description: "N8AG lot-consistent PEX: sheet/cap coefficients from the NCSU CDK HP_AMOS14TB branch, contact/via per cut from the MOSIS N8AG parametric test report (the run that shipped hp14tbN/P); junction/substrate capacitance remains withheld."
    source:
      process: HP_AMOS14TB
      run: N8AG
      files:
        - "ncsu-cdk-1.6.0/techfile/layerDefinitions.tf:676-728"
        - "ncsu-cdk-1.6.0/techfile/divaEXT.rul"
        - "ncsu-cdk-1.6.0/models/MOSIS_reports/n8ag-params.txt"
        - "ncsu-cdk-1.6.0/models/hspice/public/publicModel/hp14tbN"
        - "ncsu-cdk-1.6.0/models/hspice/public/publicModel/hp14tbP"
      calibrated: false
    magic_directives:
      # Sheet resistance source unit: Ohms/square.
      -
        kind: resist
        layers: nwell
        value: 728
        unit: ohm_per_square
        source: "layerDefinitions.tf HP_AMOS14TB nwell"
      -
        kind: resist
        layers: poly
        value: 2
        unit: ohm_per_square
        source: "layerDefinitions.tf HP_AMOS14TB poly"
      -
        kind: resist
        layers: rpoly
        value: 130
        unit: ohm_per_square
        source: "layerDefinitions.tf HP_AMOS14TB sblock; Magic rpoly is the backend alias"
      -
        kind: resist
        layers: metal1
        value: 0.07
        unit: ohm_per_square
        source: "layerDefinitions.tf HP_AMOS14TB metal1"
      -
        kind: resist
        layers: metal2
        value: 0.07
        unit: ohm_per_square
        source: "layerDefinitions.tf HP_AMOS14TB metal2"
      -
        kind: resist
        layers: metal3
        value: 0.05
        unit: ohm_per_square
        source: "layerDefinitions.tf HP_AMOS14TB metal3"

      # Contact/via resistance per cut (Ohms/cut) from the MOSIS N8AG
      # parametric test report (RUN N8AG, VENDOR HP-NID, SCN05H,
      # SMN3MLC06) - the same run that shipped the hp14tbN/P BSIM cards.
      # The NCSU CDK HP_AMOS14TB ca/cp/via/via2 values (1.95/1.7/0.75/0.55)
      # are not attributed to this run (the same block cites N98R/N74K for
      # sheet resistance), so the report values keep device + RC +
      # contact/via on the same run.  HP is a silicided process, which is
      # why these are an order of magnitude below AMI C5N.  N+ and P+
      # active values apply to both the diffusion cuts (ndc/pdc) and the
      # ohmic substrate cuts (nsc/psc).  MTL1 = M1->M2 via1 (m2c), MTL2 =
      # M2->M3 via2 (m3c) in the report's PROCESS PARAMETERS columns.
      -
        kind: contact
        contact_type: ndc
        min_size: 4
        value: 2.3
        unit: ohm_per_contact
        source: "MOSIS N8AG report N+ACTV contact 2.3 ohms/cut"
      -
        kind: contact
        contact_type: nsc
        min_size: 4
        value: 2.3
        unit: ohm_per_contact
        source: "MOSIS N8AG report N+ACTV contact 2.3 ohms/cut"
      -
        kind: contact
        contact_type: pdc
        min_size: 4
        value: 2.0
        unit: ohm_per_contact
        source: "MOSIS N8AG report P+ACTV contact 2.0 ohms/cut"
      -
        kind: contact
        contact_type: psc
        min_size: 4
        value: 2.0
        unit: ohm_per_contact
        source: "MOSIS N8AG report P+ACTV contact 2.0 ohms/cut"
      -
        kind: contact
        contact_type: pc
        min_size: 4
        value: 1.8
        unit: ohm_per_contact
        source: "MOSIS N8AG report POLY contact 1.8 ohms/cut"
      -
        kind: contact
        contact_type: m2c
        min_size: 4
        value: 0.88
        unit: ohm_per_contact
        source: "MOSIS N8AG report MTL1 0.88 ohms/cut (M1->M2 via1)"
      -
        kind: contact
        contact_type: m3c
        min_size: 5
        value: 0.36
        unit: ohm_per_contact
        source: "MOSIS N8AG report MTL2 0.36 ohms/cut (M2->M3 via2)"

      # Gate-oxide poly/active capacitance stays with hp14tbN/P BSIM cards.
      -
        kind: areacap
        layers: poly
        value: 91
        unit: af_per_um2
        source: "layerDefinitions.tf HP_AMOS14TB poly/default"
      -
        kind: areacap
        layers: metal1
        value: 51
        unit: af_per_um2
        source: "layerDefinitions.tf HP_AMOS14TB metal1/default"
      -
        kind: areacap
        layers: metal2
        value: 18
        unit: af_per_um2
        source: "layerDefinitions.tf HP_AMOS14TB metal2/default"
      -
        kind: areacap
        layers: metal3
        value: 9
        unit: af_per_um2
        source: "layerDefinitions.tf HP_AMOS14TB metal3/default"
      -
        kind: areacap
        layers: wcap
        value: 2300
        unit: af_per_um2
        source: "layerDefinitions.tf HP_AMOS14TB poly/cwell; Magic wcap is the backend alias"
      # Metal overlap coefficients are source values in aF/um^2.
      -
        kind: overlap
        upper: metal1
        lower: "ndiff,pdiff,nsd,psd,ndc,pdc,nsc,psc"
        value: 0
        unit: af_per_um2
        source: "layerDefinitions.tf HP_AMOS14TB metal1/active"
      -
        kind: overlap
        upper: metal1
        lower: "poly,pc"
        value: 82
        unit: af_per_um2
        source: "layerDefinitions.tf HP_AMOS14TB metal1/poly"
      -
        kind: overlap
        upper: metal2
        lower: "ndiff,pdiff,nsd,psd,ndc,pdc,nsc,psc"
        value: 0
        unit: af_per_um2
        source: "layerDefinitions.tf HP_AMOS14TB metal2/active"
      -
        kind: overlap
        upper: metal2
        lower: "poly,pc"
        value: 21
        unit: af_per_um2
        source: "layerDefinitions.tf HP_AMOS14TB metal2/poly"
      -
        kind: overlap
        upper: metal2
        lower: metal1
        value: 31
        unit: af_per_um2
        source: "layerDefinitions.tf HP_AMOS14TB metal2/metal1"
      -
        kind: overlap
        upper: metal3
        lower: "ndiff,pdiff,nsd,psd,ndc,pdc,nsc,psc"
        value: 0
        unit: af_per_um2
        source: "layerDefinitions.tf HP_AMOS14TB metal3/active"
      -
        kind: overlap
        upper: metal3
        lower: "poly,pc"
        value: 12
        unit: af_per_um2
        source: "layerDefinitions.tf HP_AMOS14TB metal3/poly"
      -
        kind: overlap
        upper: metal3
        lower: metal1
        value: 18
        unit: af_per_um2
        source: "layerDefinitions.tf HP_AMOS14TB metal3/metal1"
      -
        kind: overlap
        upper: metal3
        lower: metal2
        value: 48
        unit: af_per_um2
        source: "layerDefinitions.tf HP_AMOS14TB metal3/metal2"
      # Perimeter source unit: aF/um.
      -
        kind: perimc
        layers: poly
        outside: "~poly"
        value: 39
        unit: af_per_um
        source: "layerDefinitions.tf HP_AMOS14TB poly/default"
      -
        kind: perimc
        layers: metal1
        outside: "~metal1"
        value: 36
        unit: af_per_um
        source: "layerDefinitions.tf HP_AMOS14TB metal1/default"
      -
        kind: perimc
        layers: metal2
        outside: "~metal2"
        value: 10
        unit: af_per_um
        source: "layerDefinitions.tf HP_AMOS14TB metal2/default"
      -
        kind: perimc
        layers: metal3
        outside: "~metal3"
        value: 11
        unit: af_per_um
        source: "layerDefinitions.tf HP_AMOS14TB metal3/default"
      -
        kind: sideoverlap
        upper: metal1
        edge: "space,nwell,pwell,cwell"
        lower: "poly,pc"
        value: 37
        unit: af_per_um
        source: "layerDefinitions.tf HP_AMOS14TB metal1/poly"
      -
        kind: sideoverlap
        upper: metal2
        edge: "space,nwell,pwell,cwell"
        lower: "poly,pc"
        value: 12
        unit: af_per_um
        source: "layerDefinitions.tf HP_AMOS14TB metal2/poly"
      -
        kind: sideoverlap
        upper: metal2
        edge: "space,nwell,pwell,cwell"
        lower: metal1
        value: 24
        unit: af_per_um
        source: "layerDefinitions.tf HP_AMOS14TB metal2/metal1"
      -
        kind: sideoverlap
        upper: metal3
        edge: "space,nwell,pwell,cwell"
        lower: "poly,pc"
        value: 12
        unit: af_per_um
        source: "layerDefinitions.tf HP_AMOS14TB metal3/poly"
      -
        kind: sideoverlap
        upper: metal3
        edge: "space,nwell,pwell,cwell"
        lower: metal1
        value: 17
        unit: af_per_um
        source: "layerDefinitions.tf HP_AMOS14TB metal3/metal1"
      -
        kind: sideoverlap
        upper: metal3
        edge: "space,nwell,pwell,cwell"
        lower: metal2
        value: 36
        unit: af_per_um
        source: "layerDefinitions.tf HP_AMOS14TB metal3/metal2"
    withheld:
      - "junction and substrate capacitance; the HP06 source branch does not provide a direct Magic-safe mapping here (BSIM CJ/CJSW remain model-owned)"
      - "contact-chain fixture calibration against Magic hole-count semantics is a validation TODO, not a source blocker"
      - "Diva-only diode recognition and detailed polySRes body reconstruction in the Magic experiment"
