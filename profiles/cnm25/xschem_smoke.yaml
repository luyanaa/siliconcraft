# profiles/cnm25/xschem_smoke.yaml — minimal CDL smoke for the CNM25 symbols.
# The probe watches the supply current of the minimum-size inverter.
# CNM25 subcircuit instances do not expose an ngspice @instance[id] vector.
# x<name> <d> <g> <s> <b> cnm25modN w=.. l=.. m=.. ad=.. as=.. pd=.. ps=..
expected_netlist:
  - "x1 in 0 0 0 cnm25modN"
  - "x2 in out vdd vdd cnm25modP"
  - "v1 in 0 0"
  - "v2 vdd 0 5"
  - "v3 out 0 5"
probe: "-i(v2)"
min_current: 0
