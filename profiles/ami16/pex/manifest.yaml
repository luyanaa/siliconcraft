# AMI16 PEX profiles.  Coefficients are sourced from the MOSIS N88Z
# parametric test report (the run that shipped the ami16N/P BSIM cards);
# the Magic SCMOS file is only the backend grammar and connectivity
# carrier.  This is not a signoff deck.
schema_version: 2
profile: ami16
default: none
flow:
  backend: magic
  source_driven: true
  original_process: AMI_ABN
  original_run: N88Z
  topology_source: "NCSU CDK 1.6.0 techfile/divaEXT.rul extractMOS"
  capacitance_source: "NCSU CDK 1.6.0 models/MOSIS_reports/n88z-params.txt"
  contact_policy: "contact/via resistance emitted per cut from the MOSIS N88Z parametric test report; junction capacitance stays model-owned and electrode/NPN model cards remain withheld"
  parasitic_ownership:
    transistor_intrinsic_capacitance: model
    gate_overlap_capacitance: model
    junction_area_capacitance: model
    junction_sidewall_capacitance: model
    diffusion_sheet_resistance: pex
    gate_sheet_resistance: pex
    metal_interconnect_rc: pex
physical:
  lambda_um: 0.8
  magic_lambda_centimicron: 80
  magic_resistance_unit: "milliohm_per_square"
  magic_area_cap_unit: "attofarad_per_lambda2"
  magic_edge_cap_unit: "attofarad_per_lambda"
source_technology:
  file: "../../ls1u/reference/magic/pearlriver-scmos.tech"
  gds_input_map: "../reference/magic/cifin-ami16.gen"
  legacy_backend:
    technology: "scmos"
    extraction_style: "lambda=0.8(scna16_ami)"
    expected_lambda_um: 0.8
    purpose: "runtime SCMOS geometry/connectivity cross-check only; not the AMI16 coefficient source"
    source: "OpenCircuitDesign Magic scmos.tech / MOSIS SCMOS 8.2.8"
  backend_aliases:
    elec: "poly2"
    elec_poly_cap: "cap"
    pbase: "pbase"
  note: "SCMOS file supplies Magic's internal plane/connect grammar only; AMI16 GDS input and extract sections replace its process semantics. The matched scmos backend is selected only by the legacy cross-check gate."
technology:
  description: "AMI_ABN N88Z source-reference PEX (extraction scope only)"
topology:
  features:
    elec: true
    npn: true
  style: ami16_n88z
  cscale: 1
  step: 100
  sidehalo: 8
  magic_device_class: mosfet
  magic_terminal_order: "drain,gate,source,bulk"
  plane_order:
    -
      - active
      - 0
    -
      - well
      - 1
    -
      - implant
      - 2
    -
      - metal1
      - 3
    -
      - metal2
      - 4
    -
      - oxide
      - 5
  device_semantics:
    mos4:
      - nmos4
      - pmos4
      - nmos4_elec
      - pmos4_elec
    resistor:
      - polyRes
      - elecRes
      - nwellRes
    capacitor:
      - CapacitorElec
    diode:
      - NPdiode
      - PNdiode
      - NwPdiode
    npn:
      - npnTran
  scope: "AMI16 nmos4/pmos4 primitive MOS plus explicitly sourced tier-L0 route RC; electrode MOS/NPN semantics remain source-recorded"
profiles:
  none:
    generated: true
    status: topology_only
    description: "AMI16 layer map and primitive MOS topology without PEX coefficients."
    magic_directives: []
  n88z_reference:
    generated: true
    status: source_reference_partial
    description: "N88Z lot-consistent PEX: every sheet-resistance, area/perimeter capacitance, and contact/via coefficient from the MOSIS N88Z parametric test report (RUN N88Z, AMI ABN, SCN12) - the same run that shipped the ami16N/P BSIM cards. The former N77H (NCSU AMI_ABN branch) values were dropped because they did not match the model run; electrode MOS/NPN model cards remain withheld."
    source:
      process: AMI_ABN
      run: N88Z
      files:
        - "ncsu-cdk-1.6.0/models/MOSIS_reports/n88z-params.txt"
        - "ncsu-cdk-1.6.0/models/hspice/public/publicModel/ami16N"
        - "ncsu-cdk-1.6.0/models/hspice/public/publicModel/ami16P"
      calibrated: false
    magic_directives:
      # Sheet resistance source unit: Ohms/square (N88Z PROCESS PARAMETERS).
      -
        kind: resist
        layers: nwell
        value: 1524
        unit: ohm_per_square
        source: "MOSIS N88Z report N_WELL 1524 ohms/sq"
      -
        kind: resist
        layers: poly
        value: 26.1
        unit: ohm_per_square
        source: "MOSIS N88Z report POLY 26.1 ohms/sq"
      -
        kind: resist
        layers: poly2
        value: 25.2
        unit: ohm_per_square
        source: "MOSIS N88Z report POLY2 25.2 ohms/sq; Magic poly2 is the backend alias"
      -
        kind: resist
        layers: metal1
        value: 0.05
        unit: ohm_per_square
        source: "MOSIS N88Z report MTL1 0.05 ohms/sq"
      -
        kind: resist
        layers: metal2
        value: 0.03
        unit: ohm_per_square
        source: "MOSIS N88Z report MTL2 0.03 ohms/sq"

      # Contact/via resistance per cut (Ohms/cut) from the MOSIS N88Z
      # report; one contact between MTL1 and the listed layer.  The NCSU
      # CDK AMI_ABN ca/ce/cp/via values (68.5/16.4/34.8/0.05) belong to
      # the N77H run, not to the N88Z model run.  N+ and P+ active values
      # apply to both the diffusion cuts (ndc/pdc) and the ohmic substrate
      # cuts (nsc/psc).  Magic's extract contact directive is milliohms
      # per hole; the extractor divides by the estimated hole count.
      -
        kind: contact
        contact_type: ndc
        min_size: 4
        value: 65.8
        unit: ohm_per_contact
        source: "MOSIS N88Z report N+ACTV contact 65.8 ohms/cut"
      -
        kind: contact
        contact_type: nsc
        min_size: 4
        value: 65.8
        unit: ohm_per_contact
        source: "MOSIS N88Z report N+ACTV contact 65.8 ohms/cut"
      -
        kind: contact
        contact_type: pdc
        min_size: 4
        value: 36.3
        unit: ohm_per_contact
        source: "MOSIS N88Z report P+ACTV contact 36.3 ohms/cut"
      -
        kind: contact
        contact_type: psc
        min_size: 4
        value: 36.3
        unit: ohm_per_contact
        source: "MOSIS N88Z report P+ACTV contact 36.3 ohms/cut"
      -
        kind: contact
        contact_type: pc
        min_size: 4
        value: 25.7
        unit: ohm_per_contact
        source: "MOSIS N88Z report POLY contact 25.7 ohms/cut"
      -
        kind: contact
        contact_type: ec
        min_size: 6
        value: 20.2
        unit: ohm_per_contact
        source: "MOSIS N88Z report POLY2 contact 20.2 ohms/cut; Magic ec is the poly2 backend alias"
      -
        kind: contact
        contact_type: m2c
        min_size: 4
        value: 0.06
        unit: ohm_per_contact
        source: "MOSIS N88Z report MTL1 0.06 ohms/cut (M1->M2 via1)"

      # Area capacitance source unit: aF/um^2.  Single-plane substrate
      # values use the N+ACTV entry where the report splits N+/P+
      # (P+ACTV noted in the source string).  Gate-oxide poly/active
      # capacitance stays with ami16N/ami16P BSIM cards.
      -
        kind: areacap
        layers: active
        value: 287
        unit: af_per_um2
        source: "MOSIS N88Z report Area (substrate) N+ACTV 287 (P+ACTV 296)"
      -
        kind: areacap
        layers: poly
        value: 36
        unit: af_per_um2
        source: "MOSIS N88Z report Area (substrate) POLY 36"
      -
        kind: areacap
        layers: poly2
        value: 706
        unit: af_per_um2
        source: "MOSIS N88Z report Area (N+active) POLY2 706 (P+ACTV 697); Magic poly2 is the backend alias"
      -
        kind: areacap
        layers: cap
        value: 596
        unit: af_per_um2
        source: "MOSIS N88Z report Area (poly) POLY2 596; Magic cap is the derived inside(elec,poly) tile"
      -
        kind: areacap
        layers: metal1
        value: 13
        unit: af_per_um2
        source: "MOSIS N88Z report Area (substrate) MTL1 13"
      -
        kind: areacap
        layers: metal2
        value: 28
        unit: af_per_um2
        source: "MOSIS N88Z report Area (substrate) MTL2 28"
      # Two-layer overlap coefficients in aF/um^2 (metal over lower layer).
      -
        kind: overlap
        upper: metal1
        lower: "ndiff,pdiff,nsd,psd,ndc,pdc,nsc,psc"
        value: 49
        unit: af_per_um2
        source: "MOSIS N88Z report Area (N+active) MTL1 49"
      -
        kind: overlap
        upper: metal1
        lower: poly
        value: 45
        unit: af_per_um2
        source: "MOSIS N88Z report Area (poly) MTL1 45"
      -
        kind: overlap
        upper: metal1
        lower: poly2
        value: 45
        unit: af_per_um2
        source: "MOSIS N88Z report Area (poly2) MTL1 45"
      -
        kind: overlap
        upper: metal2
        lower: "ndiff,pdiff,nsd,psd,ndc,pdc,nsc,psc"
        value: 25
        unit: af_per_um2
        source: "MOSIS N88Z report Area (N+active) MTL2 25"
      -
        kind: overlap
        upper: metal2
        lower: poly
        value: 21
        unit: af_per_um2
        source: "MOSIS N88Z report Area (poly) MTL2 21"
      -
        kind: overlap
        upper: metal2
        lower: metal1
        value: 38
        unit: af_per_um2
        source: "MOSIS N88Z report Area (metal1) MTL2 38"
      # Perimeter source unit: aF/um (fringe).
      -
        kind: perimc
        layers: poly
        outside: "~poly"
        value: 44
        unit: af_per_um
        source: "MOSIS N88Z report Fringe (substrate) POLY 44"
      -
        kind: perimc
        layers: metal1
        outside: "~metal1"
        value: 35
        unit: af_per_um
        source: "MOSIS N88Z report Fringe (substrate) MTL1 35"
      -
        kind: sideoverlap
        upper: metal1
        edge: "space,nwell,pwell"
        lower: poly
        value: 55
        unit: af_per_um
        source: "MOSIS N88Z report Fringe (poly) MTL1 55"
      -
        kind: sideoverlap
        upper: metal2
        edge: "space,nwell,pwell"
        lower: poly
        value: 39
        unit: af_per_um
        source: "MOSIS N88Z report Fringe (poly) MTL2 39"
      -
        kind: sideoverlap
        upper: metal2
        edge: "space,nwell,pwell"
        lower: metal1
        value: 48
        unit: af_per_um
        source: "MOSIS N88Z report Fringe (metal1) MTL2 48"
    withheld:
      - "metal2/elec overlap; the N88Z report lists no MTL2-to-poly2 area entry"
      - "perimc metal2 ~metal2; the N88Z report lists no MTL2 substrate fringe entry"
      - "poly overlap overhang (Overlap N+ACTV 170 / P+ACTV 193); gate-overlap capacitance is owned by the ami16N/ami16P BSIM cards"
      - "junction capacitance; CJ/CJSW stay model-owned in the ami16N/ami16P BSIM cards"
      - "electrode MOS cards ami16NE/ami16PE are not shipped by the public CDK model directory"
      - "Diva-only NPN recognition and Generic_NPN calibration in the Magic experiment"
