    efficiency: "Report SCMOS(lambda=.5) ratio before native BEOL overrides."
    semantic: "Compare only rules with the same physical constraint and keep marker/cut semantics separate."
lambda_rule:
  name: openrule1um_lambda_rule
  lambda_um: 0.5
  grid_um: 0.05
  min_width_um: 1.0
  min_channel_um: 1.0
  units: microns
  lvs:
    geometry_policy: "preserve existing PCells; permit W/L adjustment on the model-card boundary"
    quantization: grid
    model_binding: exact_model_id
  cells:
    pcell_policy: preserve_existing
    standard_cell_policy: conformance_only
    replacement_required: false
    acceptance: "grid-aligned, lambda-rule legal, and LVS/model bindings remain intact"
rules: {}

rules:
  stdcell:
    rule_map:
      # --- FEOL ---
      contact.cut_size:              {value_um: 1.0, source: "SCMOS 6.1 2L; native dcont cut 1.0"}
