# profiles/openrule1um/rules.yaml — reference DRC plus portable envelope
#
# The upstream deck remains the target legality oracle.  The portable section
# is a conservative geometry contract; it is not an authoritative replacement
# for the process-specific KLayout DSL semantics.
engine: klayout_dsl_reference
authoritative: false
authoritative_policy:
  status: disabled
  reason: "The SCMOS authoritative generator is not a valid OpenRule1um rule-table source."
  selection: reference
  override:
    status: available
    lambda_um: 0.5
    geometry_scaling: none
source_deck: reference/drc.lydrc
source: "https://github.com/mineda-support/OpenRule1um/blob/85dbacfb05351c5116158f4d8e0d5c995d3b4ad1/tech/tech/drc/drc.lydrc"
notes:
  - "The upstream deck is the current target DRC oracle for this profile."
  - "Do not run scripts/gen_drc.py for this profile; its interpreter is SCMOS-only."
  - "Legality uses synthetic canonical layer geometry, not the upstream Basic GDS."
  - "Nominal cut geometry, marker containment, and DRC thresholds are separate semantics."
  - "The upstream family is a 1um design-rule envelope for a nominal PTS 0.6um CMOS process; these labels are not a conversion factor for physical geometry."
  - "TEG L/W and capacitor dimensions are physical microns; lambda_um=0.5 is the grid/reference baseline, not a multiplier."
portable:
  policy: scmos_lambda_envelope
  lambda_um: 0.5
  base_source: common/drc/scmos_reference.py
  target_drc: reference/drc.lydrc
  # OpenRule1um's GDS is GLOBALLY shrunk: the published rules are as-drawn at a
  # 1um envelope while the physical process is PTC06, roughly FEOL 0.6um /
  # BEOL 0.4um.  A global shrink does not make the BEOL special -- what differs
  # is that the two domains do not share a lambda, so they land in different
  # SCMOS arms.  Measured by solving lambda_eff = native_um / branch_multiple for
  # every native rule and taking the arm whose implied lambda has the tighter
  # spread (see docs/feol_beol_split_scaling.md):
  #   FEOL  classic  lambda_eff 0.5000  stdev 0.0742  (vs SUBM 0.0911)
  #   BEOL  SUBM     lambda_eff 0.3333  stdev 0.0739  (vs classic 0.1242)
  # and lambda_BEOL / lambda_FEOL = 0.3333 / 0.5 = 2/3, i.e. 0.6um / 0.4um.
  # 6 of the 9 BEOL rules land on exactly 1/3; the 3 exceptions are the rules
  # already listed below as native BEOL overrides.
  domains:
    feol:
      variant: non_submicron
      lambda_um: 0.5
      node_um: 1.0
    beol:
      variant: submicron
      lambda_um: 0.3333
      node_um: 0.6667
      # The BEOL's own numbers already carry the shrunk SUBM scaling, so no SCMOS
      # envelope is layered over them; the native deck is the authority there.
      envelope: none
  native_overrides:
    # Every rule reference/drc.lydrc enforces that SCMOS cannot express --
    # off-grid, marker semantics, high-poly, select-layer and marker-to-layer
    # spacings.  Values are the native deck's own, transcribed with the line
    # number they come from; SCMOS has no comparable constraint for these, so
    # there is nothing to take the stricter of.
    source: reference/drc.lydrc
    # The deck's own header calls several of these "may be pseudo-error (can be
    # ignored)"; that text is kept verbatim in the note field rather than
    # silently dropped.
    grid:
      value_um: 0.05
      layers: [nwl, diff, pol, hpol, cnt, ml1, via1, ml2, via2, ml3, parea, narea, pad]
      source_lines: "62-74"
    rules:
      - {id: OR1-NWL-SPACE, kind: space, layer: nwl, value_um: 5.0, note: "NWL space < 5.0", line: 84}
      - {id: OR1-PAREA-SPACE, kind: space, layer: parea, value_um: 0.5, note: "Parea space < 0.5", line: 85}
      - {id: OR1-NAREA-SPACE, kind: space, layer: narea, value_um: 0.5, note: "Narea space < 0.5", line: 86}
      - {id: OR1-PAREA-SEPARATION, kind: separation, layer: parea, value_um: 0.5, layer2: narea, note: "Parea-Narea space < 0.5", line: 87}
      - {id: OR1-DIFF-SPACE, kind: space, layer: diff, value_um: 1.5, note: "DIFF space < 1.5", line: 88}
      - {id: OR1-NWL-SEPARATION, kind: separation, layer: nwl, value_um: 3.0, layer2: ndiff, note: "NWL-Ndiff space < 3.0", line: 89}
      - {id: OR1-PDIFF-SEPARATION, kind: separation, layer: pdiff, value_um: 0.5, layer2: dm_nscn, note: "Pdiff-NScont space < 0.5", line: 90}
      - {id: OR1-NDIFF-SEPARATION, kind: separation, layer: ndiff, value_um: 1.0, layer2: dm_pscn, note: "Ndiff-PScont space < 1.0", line: 91}
      - {id: OR1-POL-SPACE, kind: space, layer: pol, value_um: 1.0, note: "POL space < 1.0", line: 92}
      - {id: OR1-MOS-SPACE, kind: space, layer: mos, value_um: 1.0, note: " POL(MOS) space < 1.0", line: 93}
      - {id: OR1-POL-SEPARATION-L94, kind: separation, layer: pol, value_um: 0.5, layer2: diff, note: "POL-diff space < 0.5", line: 94}
      - {id: OR1-DIFF-SEPARATION-L95, kind: separation, layer: diff, value_um: 1.0, layer2: dm_dcn, note: "Diff-dcont space < 1.0", line: 95}
      - {id: OR1-MOS-SEPARATION, kind: separation, layer: mos, value_um: 0.5, layer2: dm_dcn, note: "MOS-dcont space < 0.5", line: 96}
      - {id: OR1-DIFF-SEPARATION-L97, kind: separation, layer: diff, value_um: 1.0, layer2: dm_pcn, note: "Diff-pcont space < 1.0", line: 97}
      - {id: OR1-POL-SEPARATION-L98, kind: separation, layer: pol, value_um: 0.5, layer2: dm_pcn, note: "POL-pcont space < 0.5, may be pseudo-error (can be ignored)", line: 98}
      - {id: OR1-ML1-SPACE, kind: space, layer: ml1, value_um: 1.0, note: "ML1 space < 1.0", line: 99}
