# profiles/openrule1um/cells.yaml — cell scope and lambda-rule policy
#
# This is a coverage contract, not a request to replace every upstream PCell.
policy:
  name: lambda_rule
  source: rules.yaml:lambda_rule
  pcell_policy: preserve_existing
  standard_cell_policy: conformance_only
  replacement_required: false
  model_card_portability: "reuse existing model cards; allow physical W/L adjustment on the declared grid"
  acceptance: "lambda-rule legal geometry, grid alignment, and intact primitive model/LVS bindings"
gds_export:
  source: "user_report: Phenitec NDA conversion tool does not support multi-level cells"
  source_hierarchy: preserve_until_primitive_conversion
  converter_compatibility:
    multi_level_cells: unsupported
    preferred_order: convert_leaves_then_selectively_flatten_affected_cells
    flatten_before_primitive_conversion: forbidden
    full_chip_flatten: fallback_only
  acceptance:
    pre_conversion: "Preserve the OpenRule1um hierarchy and PCell/library identity."
    post_conversion: "Run target-PDK DRC/LVS and verify top-level pins, labels, layer/datatype, and database units."
  preflight:
    input_artifact: immutable_hierarchical_source
    output_artifact: staging_copy_only
    top_cell_selection: explicit
    ambiguous_top_cells: reject
    flatten_scope: reachable_affected_cells_only
    prune_orphan_cells: true
  equivalence_checks:
    instance_transforms: required
    pin_text_and_properties: required
    geometry_and_database_units: required
analog_support:
  status: explicit_read_only_reference
  manifest: support_cells.yaml
  library: reference/upstream/OpenRule1um_Basic.gds
  source_path: "Basic/libraries/OpenRule1um_Basic.gds"
  lookup: explicit_instance_only
  implicit_pcell_dependency: forbidden
  required_for_upstream_pcell_support: true
  required_for_primitive_simulation: false
  required_for_primitive_lvs: false
standard_cell_conformance:
  status: materialized_reference_input
  catalog: compatibility/stdcell_catalog.yaml
  required_for_primitive_lvs: false
  inputs:
    - "reference/upstream/OpenRule1um_StdCell.gds"
    - "compatibility/xschem/stdcells"
    - "tech/tech/models/ishi-kai-lib/stdcells_sim"
    - "tech/tech/models/ishi-kai-lib/stdcells_lvs"
    - "tech/tech/symbols/Xschem/Ishi-kai-OR1/stdcells"
  checks:
    grid_um: 0.05
    geometry: "run the pinned OpenRule1um reference DRC on selected cells"
    connectivity: "preserve pin order and cell-level LVS topology"
    model_binding: "require exact declared model IDs where a cell exposes a model"
  policy: "catalog and conform selected cells; do not make the whole upstream stdcell set a runtime dependency"
  placement_routing_views: not_supplied_upstream
  timing_views: not_supplied_upstream


available:
  primitive_xschem:
    - nmos4
    - pmos4
    - res
    - hres
    - r_nwell
    - r_pdiff
    - cap
    - ndiff_cap
    - pdiff_cap
    - diode
  primitive_models:
    - or1_nmos
    - or1_pmos
    - r_poly
    - r_nwell
    - r_pdiff
    - hr_poly
    - poly_cap
    - ndiff_cap
    - pdiff_cap
    - or1_diode
  lvs_reference:
    - nmos4
    - pmos4
    - r_poly
    - r_nwell
    - r_pdiff
    - cap_metal1
    - cap_metal2
    - cap_poly
    - ndiff_cap
    - pdiff_cap
    - diode
reference_only_models:
  - r_ndiff

missing:
  - id: native_pcell_registration
    reason: "The shared SCMOS PCell implementation cannot consume OpenRule1um layer/rule names directly."
    policy: "Add an adapter or preserve the existing upstream PCell; do not replace all PCells."
  - id: stdcell_placement_timing_views
    reason: "The upstream bundle supplies reference GDS and Xschem symbols but no local LEF or Liberty views."
    policy: "Keep stdcells conformance-only; do not make placement, routing, or timing signoff claims."
  - id: lvs_variant_extraction
    reason: "R_pdiff, R_nwell, and typed capacitor extraction are calibrated to measured model-card values; R_ndiff is upstream-reference-only, while M2-on-M1 and untyped poly-active variants remain provisional."
    policy: "Advertise calibrated primitive variants only; keep R_ndiff as an explicit upstream PCell reference without simulator/LVS binding, and keep provisional capacitor variants behind explicit reference-only identifiers."

reference_only:
  - "Basic/libraries/OpenRule1um_Basic.gds"
  - "Basic/libraries/OpenRule1um_StdCell.gds"
  - "tech/tech/models/ishi-kai-lib/stdcells_sim"
  - "tech/tech/models/ishi-kai-lib/stdcells_lvs"
  - "tech/tech/symbols/Xschem/Ishi-kai-OR1/stdcells"

stdcell:
  # Generated by siliconcraft's own row derivation and quantified by us; the
  # upstream library's 32.5um row is NOT the contract (see
  # docs/feol_beol_split_scaling.md).  The native deck remains the legality
  # oracle, so verification pins both decks to reference.
  architecture: three_metal_classic
  status: derived_candidate_not_signoff
  site_name: OR1_access_site
  site_width_um: 1.0
  grid_um: 0.05
  # Row derived from the resolved rule_map above, using the same formulas that
  # were cross-validated against ami06/ams_c35/hp06/tsmc035_4m2p/tsmc018_deep/
  # tsmc025_deep:
  #   n row = active.min_width + 2*gate.extension + 2*contact.cut_size
  #         = 1.0 + 2*1.0 + 2*1.0 = 5.0
  #   p row = nwell.min_width + 2*nwell.active_enclosure
  #         = 4.0 + 2*2.0 = 8.0
  #   gap   = max(active.min_width, metal.M1.min_spacing) = max(1.0, 1.0) = 1.0
  #   rail  = max(active.min_width, metal.M1.min_width)   = max(1.0, 1.0) = 1.0
  row_heights_um: {n: 5.0, p: 8.0}
  row_gap_um: 1.0
  rail_margin_um: 0.0
  site_height_um: 14.0
  source_height_um: 14.0
  orientations:
    even_row: R0
    odd_row: MX
    legal: [R0, MX]
  tap_policy: self_tapped
  well:
    type: nwell
    p_row_net: VDD
    n_row_substrate: VSS
  contacts:
    native_cut: cnt
  routing:
    metal_layers: [metal1, metal2, metal3]
    via_layers: [via1, via2]
  pin_contract:
    signal_pin_access: candidate_only
    power_pins: [VDD, VSS]
    bulk_policy: explicit_row_supply
  qualification:
    drc: native_reference_required
    lvs: native_reference_required
    pex: engineering_magic_reference
    lef: candidate_only
    liberty: unavailable
    signoff: blocked
  verification:
    drc_deck: reference
    lvs_deck: reference
  # Per-domain derivation: FEOL takes the SCMOS classic arm at lambda 0.5 but the
  # native value wherever native is stricter; BEOL takes the native deck outright
  # because it carries the shrunk SUBM scaling (domains.beol.envelope: none).
  # Each FEOL value below is min(classic_at_0.5, native) and cites which source
  # won; where the native deck has no counterpart the SCMOS value stands.
