# profiles/openrule1um/layers.yaml — OpenRule1um process layer contract
#
# Derived from the upstream KLayout layer properties file:
#   https://github.com/mineda-support/OpenRule1um/blob/master/tech/tech/OpenRule1um.lyp
# Physical rules in the upstream deck are expressed directly in microns.
# lambda_um=0.5 is the portable SCMOS-envelope baseline; the target reference
# deck does not consume it directly.
meta:
  name: openrule1um
  process: OpenRule1um
  description: "OpenRule1um 1 um bulk CMOS (KLayout-native upstream profile)"
  nominal_process_um: 0.6
  design_rule_um: 1.0
  physical_units: microns
  lambda_is_geometry_scaling: false
  lambda_um: 0.5
  grid_um: 0.05
  min_channel_um: 1.0
  min_width_um: 1.0
  model_prefix: or1
  well_type: n
  rule_family: native
  stacked_vias: true
  features:
    metal3Available: true
    hpolyAvailable: true
    resistorAvailable: true
    capacitorAvailable: true
    diodeAvailable: true
    padAvailable: true
  # The stdcell consumers speak SCMOS logical names; map them onto this
  # process's own.  The deck calls 19/0 `narea` and 18/0 `parea`, the profile
  # calls the same streams `nactive` / `pactive`.  Contact/via logical names
  # already match.
  stdcell_physical_layers:
    NSELECT: nactive
    PSELECT: pactive
    CC: contact
    CP: contact
    VIA12: via1
    VIA23: via2
  # Single n-well: the NMOS sits in the substrate, so no pwell layer exists and
  # well_n is deliberately absent (the row builder then draws wells only on the
  # p side).
  stdcell_layers:
    well_p: nwell
  # Marker layers.  The deck never checks the drawn cut; it requires every cut to
  # sit inside a marker:
  #   dmcnt = dm_dcn | dm_pcn | dm_nscn | dm_pscn ; cnt.outside(dmcnt)
  #   via1.outside(dm_via1) ; via2.outside(dm_via2)     (reference/drc.lydrc:159-165)
  # The enclosure is pinned by the upstream cells, not assumed:
  #   dcont: cnt  1.0x1.0 inside dm_dcn (L101) 2.0x2.0  -> +0.5/side
  #   Via:   via1 1.0x1.0 inside dm_via1 (L105) 2.0x2.0 -> +0.5/side
  #   pcont: cnt  1.0x1.0 inside dm_pcn (L102) 2.0x2.0  -> +0.5/side
  stdcell_markers:
    enclosure_um: 0.5
    contacts: [dcont_marker, pcont_marker]
    # Keyed by the LOGICAL via name the candidate manifest uses (VIA12/VIA23),
    # not by the physical layer name.
    vias:
      via12: via1_marker
      via23: via2_marker
  license: "Apache-2.0 (upstream OpenRule1um; preserve per-file notices)"
  sources:
    - "https://github.com/mineda-support/OpenRule1um@85dbacfb05351c5116158f4d8e0d5c995d3b4ad1"
    - "tech/tech/OpenRule1um.lyp"
    - "tech/tech/drc/drc.lydrc"
    - "tech/tech/lvs/lvs.lylvs"

