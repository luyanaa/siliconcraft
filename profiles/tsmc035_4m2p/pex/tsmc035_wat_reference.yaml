# Cross-check computed in this port: the local first-hand N88Y report versus the
# requester-supplied external sets.  This is the evidence that the external
# numbers are plausible for this process family even though they were not
# re-fetched.
cross_check:
  basis: "N88Y (local, verified) vs T2AF (external, not reverified)"
  deltas_percent:
    sheet_resistance_ohm_sq:
      nactive: 0.4
      pactive: 0.4
      poly: 17.6
      elec: -0.6
      metal1: 0.0
      metal2: 0.0
      nwell: -1.1
    contact_resistance_ohm:
      nactive: 14.4
      pactive: 12.0
      poly: 28.6
      elec: 8.6
    via_resistance_ohm:
      via: -5.3
      via2: -30.3
    capacitance_coupling:
      metal1-metal2: {area: 5.6, fringe: 3.6}
      metal1-metal3: {area: 7.7, fringe: 5.7}
      metal2-metal3: {area: 8.3, fringe: 0.0}
  top_metal_mapping:
    finding: "N88Y (3-metal) MTL3 = 0.04 ohm/sq equals T2AF/T59N (4-metal) MTL4 = 0.04 ohm/sq, while N88Y MTL1/MTL2 = 0.07 ohm/sq equals T2AF/T59N MTL1/MTL2/MTL3 = 0.07 ohm/sq.  The 3-metal run's top metal therefore falls in the same thickness class as the 4-metal option's M4, which independently corroborates the official cross-section mapping (M1 0.67 / M2 0.64 / M3 0.64 / M4 0.925 um, M4 being the thick tier)."
    confidence: high
  assessment: "CBEOL quantities (M1/M2 sheet resistance, M1-M2 / M1-M3 / M2-M3 coupling capacitance) agree within ~10%, and the top-metal tier mapping is exact.  FEOL quantities agree for N+/P+ active (~0.4%) but show real lot-to-lot spread on poly (17.6%) and on contact resistance (12-29%).  That spread is the reason a historical WAT set may be used as a research reference but never as a signoff parameter set."

caveats:
  - "Historical WAT numbers (1998-2005) are not calibrated to the current TSRI D35 revision."
  - "T2AF/T59N/T19P were supplied by citation only; the port was produced without network access and did not re-fetch them."
  - "LO_EPI and MM_EPI coefficients are kept in separate sets and must not be blended."
  - "N88Y supplies no M4 and no via3; the 4-metal reference must come from the MM_EPI set for those quantities."
  - "No temperature coefficients are materialized; no temperature correction is applied."
  - "Contact and via resistance are per-cut values; the caller owns the cut count."
