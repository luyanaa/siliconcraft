# XH035 profile fragment.
#
# The public X-FAB datasheet publishes basic geometry and module names, not the
# production GDS stream map.  The 100-series map below is therefore an
# internal logical map for synthetic DRC/LVS work only; it is not a tapeout
# interchange map.
meta:
  name: xh035
  process: XH035
  foundry: X-FAB
  description: "X-FAB XH035 0.35um bulk modular analog/HV CMOS; initial LV + HVCMOS contract"
  node_um: 0.35
  lambda_um: 0.175
  grid_um: 0.05
  min_channel_um: 0.35
  min_width_um: 0.5
  model_prefix: xh035
  well_type: n
  rule_family: scmos_subm
  stacked_vias: false
  hvcmos_rule_source: "Public XH035 datasheet basic geometry plus explicit initial voltage-policy rules; HV stream map/signoff deck unavailable"
  mask_map_status: provisional
  gds_output_policy: "provisional_logical_map_only; X-FAB PDK GDS/DRC/LVS/PEX remains tapeout authority"
  features:
    elecAvailable: false
    polycapAvailable: false
    highresAvailable: false
    metal3Available: true
    metal4Available: false
    metal5Available: false
    metal6Available: false
    metalcapAvailable: false
    cwellAvailable: false
    sblockAvailable: false
    npnAvailable: false
    pnpAvailable: false
    ccdAvailable: false
    hvAvailable: true
    hvcmosAvailable: true
    hvcmosRuleOverride: true
    hvMarkerAvailable: true
    deepNwellAvailable: true
    deepPwellAvailable: false
    driftAvailable: true
    ldmosAvailable: true
    dmosAvailable: true
    voltageAwareSpacing: true
    substratePexAvailable: true
    guardRingRulesAvailable: false
    latchupRulesAvailable: false
    memsAvailable: false
    pselectFromActive: false
  license: "Public process collateral only; no foundry PDK redistribution"
  sources:
    - "https://datasheet.datasheetarchive.com/originals/crawler/xfab.com/dd47a8c450bf3db21dd51bcf6966ea4f.pdf"
    - "https://cdn.thomasnet.com/ccp/30121834/147470.pdf"
    - "https://www.xfab.com/resourcexplorer/detail/datasheet-xh035"
    - "https://www.xfab.com/resourcexplorer/detail/a-new-methodology-for-active-substrate-parasitic-extraction-in-automotive-hv-cmos-processes"
layers:
  -
    name: nwell
    purpose: drawing
    gds:
      - {layer: 100, datatype: 0}
    role: well
    note: "Logical N-well alias; public XH035 basic rule: width 1.6um, spacing 1.0um"
  -
    name: pwell
    purpose: drawing
    gds:
      - {layer: 101, datatype: 0}
    role: well
    note: "Logical P-well alias; hierarchy use is profile-specific"
  -
    name: deep_nwell
    purpose: drawing
    gds:
      - {layer: 102, datatype: 0}
    role: isolation
    note: "Deep-N-well marker/domain; public module exists, foundry stream name not published"
  -
    name: deep_pwell
    purpose: drawing
    gds:
      - {layer: 103, datatype: 0}
    role: isolation
    available: false
    note: "Reserved for a future explicit deep-P-well variant"
  -
    name: hv_nwell
    purpose: drawing
    gds:
      - {layer: 104, datatype: 0}
    role: isolation
    note: "Logical HV-N-well alias"
  -
