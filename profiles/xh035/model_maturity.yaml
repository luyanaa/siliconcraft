    source: "Public XH035 datasheet: LV device identity and module topology"
    fit_status: unavailable
    model_form:
      current: none
      L1_candidate: bsim3v3
      official_card: unknown
    maturity:
      level: L0
      structural: true
      functional: false
      characterized: false
      signoff: false
      levels:
        L0: {status: available, representation: contract_only, model_form: none}
        L1: {status: planned_not_enabled, representation: public_surrogate, model_form: bsim3v3, fit_targets: [vth, idsat, ft]}
        L2: {status: unavailable, representation: silicon_calibrated, model_form: bsim3v3}
        L3: {status: private_only, representation: foundry_private, model_form: official_unknown}
