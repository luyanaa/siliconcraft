# XH035 public model maturity contract.
# No official X-FAB BSIM/HiSIM card is redistributed or implied here.
schema_version: 2
profile: xh035
model_policy:
  current_level: L0
  levels:
    L0:
      name: contract_only
      enables: [DRC, LVS, netlist_identity]
      timing_use: forbidden
    L1:
      name: public_surrogate
      enables: [rough_relative_timing]
      requires: [public_vth, public_idsat, public_ft, geometry_sweep]
      limitations: [no_mismatch, no_noise, no_temperature, no_signoff]
    L2:
      name: silicon_calibrated
      enables: [research_simulation, characterization]
      requires: [MPW_measurements, process_corners, temperature_sweep]
    L3:
      name: foundry_private
      enables: [foundry_signoff_when_authorized]
      requires: [private_foundry_model_and_decks]
  signoff_policy: "Only L3 with foundry-authorized collateral may support signoff claims."
