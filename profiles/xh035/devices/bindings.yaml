# Canonical MOS netlist binding for the initial XH035 contract.
# The public datasheet does not redistribute simulator cards; representation is
# contract_only and model names match provisional LVS output.
schema_version: 1
canonical_source: "../../../common/devices/canonical/mos.yaml"
bindings:
  nmos_core:
    canonical_variant: nmos_core
    layout:
      gate_types: nfet
      terminal_types: "ndiff,ndc"
      substrate_types: pwell
      substrate_node: Gnd!
    simulation:
      representation: contract_only
      name: xh035N
      prefix: m
      model_library: null
      parameter_map: {w: w, l: l, nf: nf, m: m, ad: ad, as: as, pd: pd, ps: ps}
    lvs:
      extracted_class: xh035N
      netgen_class: xh035N
      permutable:
        - [d, s]
  pmos_core:
    canonical_variant: pmos_core
    layout:
      gate_types: pfet
      terminal_types: "pdiff,pdc"
      substrate_types: nwell
      substrate_node: Vdd!
    simulation:
      representation: contract_only
      name: xh035P
      prefix: m
      model_library: null
      parameter_map: {w: w, l: l, nf: nf, m: m, ad: ad, as: as, pd: pd, ps: ps}
    lvs:
      extracted_class: xh035P
      netgen_class: xh035P
      permutable:
        - [d, s]
