# Canonical MOS/device bindings for the initial XH035 contract.
# Public cards and the foundry PDK are not redistributed; contract_only keeps
# identity stable for LVS, simulator integration, PEX, and future generators.
schema_version: 2
canonical_source: "../../../common/devices/canonical/mos.yaml"
bindings:
  nmos_core:
    canonical_family: mos4
    canonical_variant: nmos_core
    layout:
      gate_types: nfet
      terminal_types: "ndiff,ndc"
      substrate_types: pwell
      substrate_node: Gnd!
    simulation:
      representation: contract_only
      name: xh035N
      prefix: m
      model_library: null
      parameter_map: {w: w, l: l, nf: nf, m: m, ad: ad, as: as, pd: pd, ps: ps}
    lvs:
      extracted_class: xh035N
      netgen_class: xh035N
      permutable:
        -
          - d
          - s
  pmos_core:
    canonical_family: mos4
