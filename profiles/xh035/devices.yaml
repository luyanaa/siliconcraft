# XH035 initial LVS recognition.
# nmos_hv/pmos_hv are marker-derived HV devices; nldmos/pldmos additionally
# require the explicit DRIFT marker.  Model suffixes are netlist identities,
# not redistributed X-FAB simulator cards.
engine: scmos_authoritative
devices:
  mos4:
    - {name: nmos4, channel: nChannelTran, diff: nDiff, bulk_net: substrate, model_suffix: nmos}
    - {name: pmos4, channel: pChannelTran, diff: pDiff, bulk_net: nBulk, model_suffix: pmos}
    - {name: nmos_hv, channel: hvnChannelTran, diff: nHVDiff, bulk_net: auto_hv, model_suffix: nmos_hv}
    - {name: pmos_hv, channel: hvpChannelTran, diff: pHVDiff, bulk_net: nBulk, model_suffix: pmos_hv}
  ldmos:
    - {name: nldmos, channel: nDmosChannel, source_diff: nDiff, drain_diff: nDmosDiff, bulk_net: auto_hv, model_suffix: nldmos}
    - {name: pldmos, channel: pDmosChannel, source_diff: pDiff, drain_diff: pDmosDiff, bulk_net: nBulk, model_suffix: pldmos}
