# Canonical MOS netlist binding for the initial XH018 contract.
# Public cards and the foundry PDK are not redistributed; this is a
# contract_only binding for LVS identity and future model integration.
schema_version: 1
canonical_source: "../../../common/devices/canonical/mos.yaml"
bindings:
  nmos_core:
    canonical_variant: nmos_core
    layout:
      gate_types: nfet
      terminal_types: "ndiff,ndc"
      substrate_types: pwell
      substrate_node: Gnd!
    simulation:
      representation: contract_only
      name: xh018N
      prefix: m
      model_library: null
      parameter_map: {w: w, l: l, nf: nf, m: m, ad: ad, as: as, pd: pd, ps: ps}
    lvs:
      extracted_class: xh018N
      netgen_class: xh018N
      permutable:
        - [d, s]
  pmos_core:
    canonical_variant: pmos_core
    layout:
      gate_types: pfet
      terminal_types: "pdiff,pdc"
      substrate_types: nwell
      substrate_node: Vdd!
    simulation:
      representation: contract_only
      name: xh018P
      prefix: m
      model_library: null
      parameter_map: {w: w, l: l, nf: nf, m: m, ad: ad, as: as, pd: pd, ps: ps}
    lvs:
      extracted_class: xh018P
      netgen_class: xh018P
      permutable:
        - [d, s]
