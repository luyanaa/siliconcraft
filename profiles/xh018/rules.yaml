# XH018 initial DRC contract.
# Public XH018 basic geometry is used for the primitive layers.  The HVCMOS
# voltage table is an explicit provisional policy, not an X-FAB signoff deck.
rules:
  grid: {x: 0.01, y: 0.01}
  # Semantic fixed-height-cell adapter.  XH018 is a voltage-classification
  # pressure test only; this LV adapter is not a production stdcell claim.
  stdcell:
    adapter: xh018_lv_provisional
    rule_map:
      contact.cut_size: {value_um: 0.22}
      contact.cut_spacing: {value_um: 0.25}
      active.min_width: {value_um: 0.22}
      poly.min_width: {value_um: 0.18}
      poly.min_spacing: {value_um: 0.25}
      poly.contact_enclosure: {value_um: 0.05}
      active.contact_enclosure: {value_um: 0.05}
      active.contact_gate_spacing: {value_um: 0.1}
      select.active_enclosure.n: {value_um: 0.08}
      select.active_enclosure.p: {value_um: 0.08}
      select.channel_enclosure.n: {value_um: 0.08}
      select.channel_enclosure.p: {value_um: 0.08}
      gate.extension: {value_um: 0.1}
      select.contact_enclosure.n: {value_um: 0.08}
      select.contact_enclosure.p: {value_um: 0.08}
      metal1.contact_enclosure: {value_um: 0.05}
      nwell.active_enclosure: {value_um: 1.4}
      nwell.min_width: {value_um: 0.86}
      via12.cut_size: {value_um: 0.26}
      via12.cut_spacing: {value_um: 0.26}
      via12.lower_enclosure: {value_um: 0.04}
      via12.upper_enclosure: {value_um: 0.04}
      via12.poly_spacing: {value_um: 0.1}
      via12.active_spacing: {value_um: 0.1}
      via23.cut_size: {value_um: 0.26}
      via23.cut_spacing: {value_um: 0.26}
      via23.lower_enclosure: {value_um: 0.04}
      via23.upper_enclosure: {value_um: 0.04}
      metal.M1.min_width: {value_um: 0.23}
      metal.M1.min_spacing: {value_um: 0.27}
      metal.M2.min_width: {value_um: 0.28}
      metal.M2.min_spacing: {value_um: 0.28}
      metal.M3.min_width: {value_um: 0.28}
      metal.M3.min_spacing: {value_um: 0.28}
  width:
    - {id: XH018.W.NWELL, layer: nwell, value_um: 0.86, source: "XH018 public datasheet", note: "N-well minimum width"}
    - {id: XH018.W.PWELL, layer: pwell, value_um: 0.86, source: "SCMOS_SUBM baseline", note: "P-well baseline"}
    - {id: XH018.W.ACTIVE, layer: active, value_um: 0.22, source: "XH018 public datasheet", note: "Active minimum width"}
    - {id: XH018.W.POLY, layer: poly, value_um: 0.18, source: "XH018 public datasheet", note: "Poly gate minimum width"}
    - {id: XH018.W.NSELECT, layer: nselect, value_um: 0.22, source: "SCMOS_SUBM baseline", note: "Select baseline"}
    - {id: XH018.W.PSELECT, layer: pselect, value_um: 0.22, source: "SCMOS_SUBM baseline", note: "Select baseline"}
    - {id: XH018.W.CC, layer: cc, value_um: 0.22, source: "XH018 public datasheet", note: "Contact minimum width"}
    - {id: XH018.W.M1, layer: metal1, value_um: 0.23, source: "XH018 public datasheet", note: "Metal1 minimum width"}
    - {id: XH018.W.VIA1, layer: via, value_um: 0.26, source: "XH018 public datasheet", note: "Via1 minimum width"}
    - {id: XH018.W.M2, layer: metal2, value_um: 0.28, source: "XH018 public datasheet", note: "Metal2 minimum width"}
    - {id: XH018.W.VIA2, layer: via2, value_um: 0.26, source: "XH018 public datasheet", note: "Via2 minimum width"}
    - {id: XH018.W.M3, layer: metal3, value_um: 0.28, condition: metal3, source: "XH018 public datasheet", note: "Metal3 minimum width"}
    - {id: XH018.W.M4, layer: metal4, value_um: 0.28, condition: metal4, source: "XH018 public datasheet", note: "Metal4 minimum width"}
    - {id: XH018.W.M5, layer: metal5, value_um: 0.28, condition: metal5, source: "XH018 public datasheet", note: "Metal5 minimum width"}
    - {id: XH018.W.M6, layer: metal6, value_um: 0.44, condition: metal6, source: "XH018 public datasheet", note: "Logical top metal minimum width"}
  spacing:
    - {id: XH018.S.NWELL, layer: nwell, value_um: 1.4, source: "XH018 public datasheet", note: "N-well spacing"}
    - {id: XH018.S.PWELL, layer: pwell, value_um: 1.4, source: "SCMOS_SUBM baseline", note: "P-well baseline"}
    - {id: XH018.S.ACTIVE, layer: active, value_um: 0.28, source: "XH018 public datasheet", note: "Active spacing"}
    - {id: XH018.S.POLY, layer: poly, value_um: 0.25, source: "XH018 public datasheet", note: "Poly spacing"}
    - {id: XH018.S.NSELECT, layer: nselect, value_um: 0.28, source: "SCMOS_SUBM baseline", note: "Select spacing"}
    - {id: XH018.S.PSELECT, layer: pselect, value_um: 0.28, source: "SCMOS_SUBM baseline", note: "Select spacing"}
    - {id: XH018.S.CC, layer: cc, value_um: 0.25, source: "XH018 public datasheet", note: "Contact spacing"}
    - {id: XH018.S.M1.PUBLIC, layer: metal1, value_um: 0.23, authority: public_native, source: "XH018 public datasheet", note: "Public-native metal1 spacing"}
    - {id: XH018.S.M1, layer: metal1, value_um: 0.27, authority: scmos_compat, source: "SCMOS_SUBM baseline (3lambda)", override_of: "XH018 public datasheet 0.23", note: "SCMOS compatibility metal1 spacing; voltage table handles net class"}
    - {id: XH018.S.VIA1, layer: via, value_um: 0.26, source: "XH018 public datasheet", note: "Via1 spacing"}
    - {id: XH018.S.M2, layer: metal2, value_um: 0.28, source: "XH018 public datasheet", note: "Metal2 spacing"}
    - {id: XH018.S.VIA2, layer: via2, value_um: 0.26, source: "XH018 public datasheet", note: "Via2 spacing"}
    - {id: XH018.S.M3, layer: metal3, value_um: 0.28, condition: metal3, source: "XH018 public datasheet", note: "Metal3 spacing"}
    - {id: XH018.S.M4, layer: metal4, value_um: 0.28, condition: metal4, source: "XH018 public datasheet", note: "Metal4 spacing"}
    - {id: XH018.S.M5, layer: metal5, value_um: 0.28, condition: metal5, source: "XH018 public datasheet", note: "Metal5 spacing"}
    - {id: XH018.S.M6, layer: metal6, value_um: 0.46, condition: metal6, source: "XH018 public datasheet", note: "Logical top metal spacing"}
  enclosure:
    - {id: XH018.E.NSELECT.ACTIVE, layer: nselect, layer2: active, value_um: 0.08, source: "SCMOS_SUBM baseline", note: "Select over active"}
    - {id: XH018.E.PSELECT.ACTIVE, layer: pselect, layer2: active, value_um: 0.08, source: "SCMOS_SUBM baseline", note: "Select over active"}
    - {id: XH018.E.ACTIVE.CC, layer: active, layer2: cc, value_um: 0.05, source: "SCMOS_SUBM baseline", note: "Active around contact"}
    - {id: XH018.E.POLY.CC, layer: poly, layer2: cc, value_um: 0.05, source: "SCMOS_SUBM baseline", note: "Poly around contact"}
    - {id: XH018.E.M1.CC, layer: metal1, layer2: cc, value_um: 0.05, source: "SCMOS_SUBM baseline", note: "Metal1 around contact"}
    - {id: XH018.E.M2.VIA1, layer: metal2, layer2: via, value_um: 0.01, source: "SCMOS_SUBM baseline", note: "Metal2 around via1"}
    - {id: XH018.E.M3.VIA2, layer: metal3, layer2: via2, value_um: 0.01, condition: metal3, source: "SCMOS_SUBM baseline", note: "Metal3 around via2"}
    - {id: XH018.E.M4.VIA3, layer: metal4, layer2: via3, value_um: 0.01, condition: metal4, source: "SCMOS_SUBM baseline", note: "Metal4 around via3"}
    - {id: XH018.E.M5.VIA4, layer: metal5, layer2: via4, value_um: 0.01, condition: metal5, source: "SCMOS_SUBM baseline", note: "Metal5 around via4"}
    - {id: XH018.E.M6.VIA5, layer: metal6, layer2: via5, value_um: 0.04, condition: metal6, source: "XH018 public datasheet top-via policy", note: "Top metal around top via"}
  extension: []
  area: []
  notch: []
  overlap: []
hvcmos:
  voltage_classification:
    mode: strict
    marker_inference: false
    require_annotation: true
    unknown_rule_id: XH018.HV.VOLTAGE.UNKNOWN
  markers:
    - {id: XH018.HV.MARK.N, marker: hvNMarker, target: nHVDiff, relation: inside, source: "Initial HVCMOS contract", note: "HV-N marker must cover derived HV diffusion"}
    - {id: XH018.HV.MARK.P, marker: hvPMarker, target: pHVDiff, relation: inside, source: "Initial HVCMOS contract", note: "HV-P marker must cover derived HV diffusion"}
    - {id: XH018.HV.MARK.N.EXCL, marker: hvNMarker, target: pDiff, relation: disjoint, source: "Initial HVCMOS contract", note: "HV-N marker cannot select P diffusion"}
    - {id: XH018.HV.MARK.P.EXCL, marker: hvPMarker, target: nDiff, relation: disjoint, source: "Initial HVCMOS contract", note: "HV-P marker cannot select N diffusion"}
  hierarchy:
    - {id: XH018.HV.WELL.1, outer: deep_nwell, inner: pwell, source: "XH018 public HVMOS hierarchy", note: "Isolated P-well must remain within deep N-well"}
  drift:
    - {id: XH018.HV.DRIFT.N, marker: drift_n, target: active, relation: inside, parent: hvNMarker, source: "Initial HVCMOS contract", note: "N drift must be active and HV-marked"}
    - {id: XH018.HV.DRIFT.P, marker: drift_p, target: active, relation: inside, parent: hvPMarker, source: "Initial HVCMOS contract", note: "P drift must be active and HV-marked"}
  voltage_spacing:
    - {id: XH018.HV.S.LV_LV, layer: metal1, class1: lv, class2: lv, value_um: 0.27, potential: any, source: "SCMOS_SUBM baseline (3lambda)", note: "LV-LV minimum spacing"}
    - {id: XH018.HV.S.LV_HV, layer: metal1, class1: lv, class2: hv, value_um: 0.72, potential: any, source: "Initial policy: 8lambda; not foundry signoff", note: "LV-HV minimum spacing"}
    - {id: XH018.HV.S.HV_HV_SAME, layer: metal1, class1: hv, class2: hv, value_um: 0.36, potential: same, source: "Initial policy: 4lambda; not foundry signoff", note: "HV-HV same-potential spacing"}
    - {id: XH018.HV.S.HV_HV_DIFF, layer: metal1, class1: hv, class2: hv, value_um: 1.08, potential: different, source: "Initial policy: 12lambda; not foundry signoff", note: "HV-HV different-potential spacing"}
