# XH018 profile fragment.
# Public X-FAB collateral exposes process modules/basic geometry, not the
# production GDS stream map.  The 300-series map is an internal logical map
# for contract tests and early layout experiments only.
meta:
  name: xh018
  process: XH018
  foundry: X-FAB
  description: "X-FAB XH018 0.18um bulk modular analog/HV CMOS; initial LV + HVCMOS contract"
  node_um: 0.18
  lambda_um: 0.09
  grid_um: 0.01
  min_channel_um: 0.18
  min_width_um: 0.22
  model_prefix: xh018
  well_type: n
  rule_family: scmos_subm
  stacked_vias: false
  hvcmos_rule_source: "Public XH018 datasheet basic geometry plus explicit initial voltage-policy rules; HV stream map/signoff deck unavailable"
  mask_map_status: provisional
  mask_map_authority: internal_logical
  public_reference_maps:
    - path: reference_maps/EFXH018D_lite.yaml
      authority: public_reference
      scope: ontology_and_numeric_anchors
      tapeout_eligible: false
  physical_layer_ontology:
    middle_metal_aliases: [metal5, METMID]
    top_metal_aliases: [metal6, METTHK, metaltp]
    thick_metal_aliases: [metal_thick, metaltpl]
    note: "Ordinal M5/M6 names are internal aliases; public reference METMID/METTHK and top/thick module roles remain distinct from the logical map."
  gds_output_policy: "provisional_logical_map_only; X-FAB PDK GDS/DRC/LVS/PEX remains tapeout authority"
  features:
    elecAvailable: false
    polycapAvailable: false
    highresAvailable: false
    metal3Available: true
    metal4Available: true
    metal5Available: true
    metal6Available: true
    metalcapAvailable: false
    cwellAvailable: false
    sblockAvailable: false
    npnAvailable: false
    pnpAvailable: false
    ccdAvailable: false
    hvAvailable: true
    hvcmosAvailable: true
    hvcmosRuleOverride: true
    hvMarkerAvailable: true
    deepNwellAvailable: true
    deepPwellAvailable: false
    driftAvailable: true
    ldmosAvailable: true
    dmosAvailable: true
    voltageAwareSpacing: true
    # Substrate PEX is REQUIRED for signoff on this process, but no backend,
    # substrate stack, or calibrated coefficient exists in this repository.
    # The former `substratePexAvailable: true` conflated "substrate coupling
    # matters for this process" with "this repository can extract it".
    substratePexRequired: true
    substratePexAvailable: false
    guardRingRulesAvailable: false
    latchupRulesAvailable: false
    memsAvailable: false
    pselectFromActive: false
  license: "Public process collateral only; no foundry PDK redistribution"
  sources:
    - "https://www.electronicspecifier.com/wp-content/uploads/2025/07/X-Fab-XH018-Datasheet.pdf"
    # Generic X-FAB automotive-HV-CMOS methodology paper, cited identically by
    # xh035 and xh018.  It is NOT an XH018-specific substrate document, so it
    # supports "substrate extraction is required", not "XH018 substrate data".
    - "https://www.xfab.com/resourcexplorer/detail/a-new-methodology-for-active-substrate-parasitic-extraction-in-automotive-hv-cmos-processes"
    # NOTE: this is an XH035 datasheet URL appearing in the XH018 profile.
    # Flagged as a suspected copy-paste artifact; left in place rather than
    # silently deleted, because it may have been an intentional shared reference.
    - "https://www.xfab.com/resourcexplorer/detail/datasheet-xh035"
layers:
  -
    name: nwell
    purpose: drawing
    gds:
      - {layer: 300, datatype: 0}
    role: well
    note: "Logical N-well alias; public XH018 basic rule: width 0.86um, spacing 1.4um"
  -
    name: pwell
    purpose: drawing
