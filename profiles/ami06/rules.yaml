# profiles/ami06/rules.yaml — authoritative DRC rule table (AMI_C5N, SCMOS)
#
# Curated from the NCSU CDK 1.6.0 Diva deck (techfile/divaDRC.rul) and the
# MOSIS SCMOS design rules.  Single source of truth for the authoritative
# DRC deck: scripts/gen_drc.py emits generated/drc/run.py; conformance.py
# compares it against the reference (oracle) deck.  Porting to another
# SCMOS process = editing this table.
#
# Condition syntax (comma = AND, | = OR, not- = negate; always quoted):
#   feature keys: submicron, deep, stacked, elec, highres, metal3..metal6,
#                 cwell, sblock, polycap, ccd, npn, hv, metalcap, mems
#   tech keys:    tech:NAME, tech-not-in:A,B,C
#   absent        = always applies
#
# Layer names resolve to raw input layers or Diva-derived layers (nNotOhmic,
# nBulk, pBulk, nOhmic, pOhmic, ca, cp, ce, Gate, fieldPoly, nChannel,
# pChannel, CapacitorElec, TransistorElec, fieldElec, highres, elecHighres)
# plus pad-derived names (BondingPad, ProbePad, Pad, near_<layer>).
#
# Notch checks are collapsed into their spacing rules (same approximation as
# the reference deck).  Universal checks (DBM, off-grid, pad geometry,
# saveDerived markers) are code in common/drc/scmos_authoritative.py.

