# AMI06 PEX profiles.  Values are sourced from the original NCSU CDK process;
# the Magic SCMOS technology is used only as a backend grammar and connectivity
# carrier.  This is not a signoff deck.
schema_version: 2
profile: ami06
default: none
flow:
  backend: magic
  source_driven: true
  original_process: AMI_C5N
  original_run: N8BN
  topology_source: "NCSU CDK 1.6.0 techfile/divaEXT.rul extractMOS"
  capacitance_source: "NCSU CDK 1.6.0 techfile/divaMultiLevel.il and layerDefinitions.tf"
  contact_policy: "contact/via resistance emitted per cut from the MOSIS N8BN parametric test report; junction/substrate capacitance remains withheld pending a Magic-safe mapping"
  parasitic_ownership:
    transistor_intrinsic_capacitance: model
    gate_overlap_capacitance: model
    junction_area_capacitance: model
    junction_sidewall_capacitance: model
    diffusion_sheet_resistance: pex
    gate_sheet_resistance: pex
    metal_interconnect_rc: pex
physical:
  lambda_um: 0.3
  magic_lambda_centimicron: 30
  magic_resistance_unit: "milliohm_per_square"
  magic_area_cap_unit: "attofarad_per_lambda2"
  magic_edge_cap_unit: "attofarad_per_lambda"
source_technology:
  file: "../../ls1u/reference/magic/pearlriver-scmos.tech"
  gds_input_map: "../reference/magic/cifin-ami06.gen"
  legacy_backend:
    technology: "scmos-sub"
    extraction_style: "lambda=0.30"
    expected_lambda_um: 0.3
    purpose: "runtime SCMOS geometry/connectivity cross-check only; not the AMI06 coefficient source"
    source: "OpenCircuitDesign Magic scmos-sub.tech / MOSIS SCMOS 8.2.8"
  note: "SCMOS file supplies Magic's internal plane/connect grammar only; AMI06 GDS input and extract sections replace its process semantics. The matched scmos-sub backend is selected only by the legacy cross-check gate."
topology_fragment: "../reference/magic/extract_topology.tech.in"
technology:
  description: "AMI_C5N N8BN source-reference PEX (extraction scope only)"
topology:
  style: ami06_n8bn
  cscale: 1
  step: 100
  sidehalo: 8
  magic_device_class: mosfet
  magic_terminal_order: "drain,gate,source,bulk"
  scope: "AMI06 nmos4/pmos4 primitive MOS plus explicitly sourced L0 route RC"
profiles:
  none:
    generated: true
    status: topology_only
    description: "AMI06 layer map and primitive MOS topology without PEX coefficients."
    magic_directives: []
  n8bn_reference:
    generated: true
    status: source_reference_partial
    description: "N8BN lot-consistent PEX: sheet/cap coefficients from the NCSU CDK AMI_C5N branch, contact/via per cut from the MOSIS N8BN parametric test report; junction/substrate capacitance remains withheld."
    source:
      process: AMI_C5N
      run: N8BN
      files:
        - "ncsu-cdk-1.6.0/techfile/layerDefinitions.tf:813-863"
        - "ncsu-cdk-1.6.0/techfile/divaEXT.rul"
        - "ncsu-cdk-1.6.0/techfile/divaMultiLevel.il"
        - "ncsu-cdk-1.6.0/models/MOSIS_reports/n8bn-params.txt"
        - "https://class.ece.iastate.edu/djchen/EE501/2016/MOSIS%20AMI0.5um%20n8bn-params_2.pdf"
      calibrated: false
    magic_directives:
      # Sheet resistance source unit: Ohms/square.
      -
        kind: resist
        layers: nwell
        value: 819
        unit: ohm_per_square
        source: "layerDefinitions.tf AMI_C5N nwell"
      -
        kind: resist
        layers: poly
        value: 25
        unit: ohm_per_square
        source: "layerDefinitions.tf AMI_C5N poly"
      -
        kind: resist
        layers: poly2
        value: 26
        unit: ohm_per_square
        source: "layerDefinitions.tf AMI_C5N elec; Magic poly2 is the backend alias"
      -
        kind: resist
        layers: metal1
        value: 0.09
        unit: ohm_per_square
        source: "layerDefinitions.tf AMI_C5N metal1"
      -
        kind: resist
        layers: metal2
        value: 0.09
        unit: ohm_per_square
        source: "layerDefinitions.tf AMI_C5N metal2"
      -
        kind: resist
        layers: metal3
        value: 0.05
        unit: ohm_per_square
        source: "layerDefinitions.tf AMI_C5N metal3"

      # Contact/via resistance per cut (Ohms/cut) from the MOSIS N8BN
      # parametric test report (RUN N8BN, VENDOR AMI, SCN05H, AMI C5N).
      # The NCSU CDK AMI_C5N ca/ce/cp/via/via2 values (92.3/17.0/17.7/
      # 0.71/0.81) are NOT this lot (they match the later T01X run), so
      # the report values keep device + RC + contact/via on the same run.
      # Magic's extract contact directive is milliohms per hole; the
      # extractor divides by the estimated hole count.  N+ and P+ active
      # values apply to both the diffusion cuts (ndc/pdc) and the ohmic
      # substrate cuts (nsc/psc).  MTL1 = M1->M2 via1 (m2c), MTL2 =
      # M2->M3 via2 (m3c) in the report's PROCESS PARAMETERS columns.
      -
        kind: contact
        contact_type: ndc
        min_size: 4
        value: 51.0
        unit: ohm_per_contact
        source: "MOSIS N8BN report N+ACTV contact 51.0 ohms/cut"
      -
        kind: contact
        contact_type: nsc
        min_size: 4
        value: 51.0
        unit: ohm_per_contact
        source: "MOSIS N8BN report N+ACTV contact 51.0 ohms/cut"
      -
        kind: contact
        contact_type: pdc
        min_size: 4
        value: 116.0
        unit: ohm_per_contact
        source: "MOSIS N8BN report P+ACTV contact 116.0 ohms/cut"
      -
        kind: contact
        contact_type: psc
        min_size: 4
        value: 116.0
        unit: ohm_per_contact
        source: "MOSIS N8BN report P+ACTV contact 116.0 ohms/cut"
      -
        kind: contact
        contact_type: pc
        min_size: 4
        value: 17.7
        unit: ohm_per_contact
        source: "MOSIS N8BN report POLY contact 17.7 ohms/cut"
      -
        kind: contact
        contact_type: ec
        min_size: 6
        value: 17.1
        unit: ohm_per_contact
        source: "MOSIS N8BN report POLY2 contact 17.1 ohms/cut; Magic ec is the poly2 backend alias"
      -
        kind: contact
        contact_type: m2c
        min_size: 4
        value: 1.58
        unit: ohm_per_contact
        source: "MOSIS N8BN report MTL1 1.58 ohms/cut (M1->M2 via1)"
      -
        kind: contact
        contact_type: m3c
        min_size: 5
        value: 1.85
        unit: ohm_per_contact
        source: "MOSIS N8BN report MTL2 1.85 ohms/cut (M2->M3 via2)"

      # Area capacitance source unit: aF/um^2.  Gate-oxide poly/active
      # capacitance is excluded because ami06N/ami06P BSIM cards own it.
      -
        kind: areacap
        layers: poly
        value: 93
        unit: af_per_um2
        source: "layerDefinitions.tf AMI_C5N poly/default"
      -
        kind: areacap
        layers: metal1
        value: 36
        unit: af_per_um2
        source: "layerDefinitions.tf AMI_C5N metal1/default"
      -
        kind: areacap
        layers: metal2
        value: 21
        unit: af_per_um2
        source: "layerDefinitions.tf AMI_C5N metal2/default"
      -
        kind: areacap
        layers: metal3
        value: 12
        unit: af_per_um2
        source: "layerDefinitions.tf AMI_C5N metal3/default"

      # Intentional electrode/poly overlap.  The 2400 aF/um^2 poly/active
      # value is not emitted here because it would duplicate BSIM intrinsic
      # gate capacitance in the normal MOS path.
      -
        kind: areacap
        layers: cap
        value: 798
        unit: af_per_um2
        source: "layerDefinitions.tf AMI_C5N elec/poly; Magic cap is the derived inside(elec,poly) tile"
      -
        kind: overlap
        upper: metal1
        lower: "ndiff,pdiff,nsd,psd,ndc,pdc,nsc,psc"
        value: 60
        unit: af_per_um2
        source: "layerDefinitions.tf AMI_C5N metal1/active"
      -
        kind: overlap
        upper: metal1
        lower: "poly,pc/a"
        value: 55
        unit: af_per_um2
        source: "layerDefinitions.tf AMI_C5N metal1/poly"
      -
        kind: overlap
        upper: metal1
        lower: "poly2,ec/a,cap"
        value: 57
        unit: af_per_um2
        source: "layerDefinitions.tf AMI_C5N metal1/elec"
      -
        kind: overlap
        upper: metal2
        lower: "ndiff,pdiff,nsd,psd,ndc,pdc,nsc,psc"
        value: 27
        unit: af_per_um2
        source: "layerDefinitions.tf AMI_C5N metal2/active"
      -
        kind: overlap
        upper: metal2
        lower: "poly,pc/a"
        value: 22
        unit: af_per_um2
        source: "layerDefinitions.tf AMI_C5N metal2/poly"
      -
        kind: overlap
        upper: metal2
        lower: metal1
        value: 34
        unit: af_per_um2
        source: "layerDefinitions.tf AMI_C5N metal2/metal1"
      -
        kind: overlap
        upper: metal3
        lower: "ndiff,pdiff,nsd,psd,ndc,pdc,nsc,psc"
        value: 19
        unit: af_per_um2
        source: "layerDefinitions.tf AMI_C5N metal3/active"
      -
        kind: overlap
        upper: metal3
        lower: "poly,pc/a"
        value: 14
        unit: af_per_um2
        source: "layerDefinitions.tf AMI_C5N metal3/poly"
      -
        kind: overlap
        upper: metal3
        lower: metal1
        value: 18
        unit: af_per_um2
        source: "layerDefinitions.tf AMI_C5N metal3/metal1"
      -
        kind: overlap
        upper: metal3
        lower: metal2
        value: 35
        unit: af_per_um2
        source: "layerDefinitions.tf AMI_C5N metal3/metal2"

      # Perimeter source unit: aF/um.  These are emitted as Magic's
      # perimc/sideoverlap terms after lambda conversion.
      -
        kind: perimc
        layers: poly
        outside: "~poly"
        value: 93
        unit: af_per_um
        source: "layerDefinitions.tf AMI_C5N poly/default"
      -
        kind: perimc
        layers: metal1
        outside: "~metal1"
        value: 77
        unit: af_per_um
        source: "layerDefinitions.tf AMI_C5N metal1/default"
      -
        kind: perimc
        layers: metal2
        outside: "~metal2"
        value: 50
        unit: af_per_um
        source: "layerDefinitions.tf AMI_C5N metal2/default"
      -
        kind: perimc
        layers: metal3
        outside: "~metal3"
        value: 55
        unit: af_per_um
        source: "layerDefinitions.tf AMI_C5N metal3/default"
      -
        kind: sideoverlap
        upper: metal1
        edge: "space,nwell,pwell"
        lower: "poly,pc/a"
        value: 64
        unit: af_per_um
        source: "layerDefinitions.tf AMI_C5N metal1/poly"
      -
        kind: sideoverlap
        upper: metal2
        edge: "space,nwell,pwell"
        lower: "poly,pc/a"
        value: 47
        unit: af_per_um
        source: "layerDefinitions.tf AMI_C5N metal2/poly"
      -
        kind: sideoverlap
        upper: metal2
        edge: "space,nwell,pwell"
        lower: metal1
        value: 56
        unit: af_per_um
        source: "layerDefinitions.tf AMI_C5N metal2/metal1"
      -
        kind: sideoverlap
        upper: metal3
        edge: "space,nwell,pwell"
        lower: "poly,pc/a"
        value: 35
        unit: af_per_um
        source: "layerDefinitions.tf AMI_C5N metal3/poly"
      -
        kind: sideoverlap
        upper: metal3
        edge: "space,nwell,pwell"
        lower: metal1
        value: 39
        unit: af_per_um
        source: "layerDefinitions.tf AMI_C5N metal3/metal1"
      -
        kind: sideoverlap
        upper: metal3
        edge: "space,nwell,pwell"
        lower: metal2
        value: 48
        unit: af_per_um
        source: "layerDefinitions.tf AMI_C5N metal3/metal2"

    withheld:
      - "junction and substrate capacitance; the AMI06 source branch does not provide a direct Magic-safe mapping here (BSIM CJ/CJSW remain model-owned)"
      - "poly/active intrinsic gate capacitance; ami06N/ami06P BSIM cards own it"
      - "contact-chain fixture calibration against Magic hole-count semantics is a validation TODO, not a source blocker"
      - "highres resistor body mapping; GDS CHR is recorded but not silently aliased"
      - "Diva-only diode/NPN recognition in the Magic experiment"
