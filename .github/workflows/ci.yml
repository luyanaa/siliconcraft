name: ci

on:
  push:
  pull_request:

jobs:
  conformance:
    name: AMI06 DRC/LVS conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate normalized, historical, and stdcell contracts
        run: |
          python3 scripts/test_process_ir.py
          python3 scripts/test_scmos_rule_families.py
          python3 scripts/test_ams_c35_gds_map.py
          python3 scripts/test_historical_scmos.py
          python3 scripts/test_stdcell_spice_pex.py
          python3 scripts/test_stdcell_generator_contract.py
          python3 scripts/test_stdcell_generator.py
          python3 scripts/test_routing_grammar.py
          python3 scripts/inspect_routing_grammar.py --profile ls1u --output /tmp/ls1u-routing-grammar.json
          python3 scripts/test_device_ir_contracts.py
          python3 scripts/test_device_oracles.py
          python3 scripts/test_tsmc035_pex.py
      - name: Generate routed stdcell candidates for every enabled profile
        # Pure-Python planner gate: exercises an inverter through
        # generate_candidates for each profile that has a sourced rule map and a
        # fixed-height row contract, so a profile cannot silently regress out of
        # the supported set.  Also runs the xh018/xh035 LV adapter smoke.
        run: python3 scripts/test_stdcell_profile_contracts.py
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - name: Run recognition compiler checks
        run: >
          nix-shell -p klayout python3 --run
          "python3 scripts/test_recognition_ir.py"
      - name: Generate analog PCells for every profile that declares them
        # Profiles with no PCell contract (ls1u declares `engine: unavailable`)
        # report a declared absence and exit 0 rather than failing.
        # Single-quoted --run so the loop variable reaches nix-shell instead of
        # being expanded (to empty) by the outer bash.
        run: >
          nix-shell -p klayout python3 --run
          'for p in ami06 ami16 ams_c35 hp06 ls1u tsmc035_4m2p; do
          SILICONCRAFT_PROFILE=$p SILICONCRAFT_OUTPUT=/tmp/pcells-$p.gds
          klayout -b -r scripts/run_pcells.py || exit 1; done'
      - name: Run xschem symbol and smoke gates
        # Every profile that ships a model library and an xschem_smoke.yaml must
        # netlist and simulate.  xh018/xh035 are excluded: neither has a public
        # compact-model card, so no simulated smoke can exist for them.
        run: >
          nix-shell -p xschem ngspice python3 --run
          'for p in ami06 ami16 ams_c35 cnm25 hp06 ls1u openrule1um tr1um
          tsmc018_deep tsmc025_deep tsmc035_4m2p; do
          python3 scripts/run_xschem.py --profile $p || exit 1; done'
      - name: Run siliconcraft AMI06 conformance gate
        run: >
          nix-shell -p klayout netgen magic-vlsi ngspice tk python3 --run
          "python3 scripts/run_ci.py --profile ami06"
      - name: Run AMI06 stdcell geometry, PEX, and LEF gates
        # Separate step from run_ci.py so a failure here is attributable; this
        # chain was previously unreachable because it hung off run_ci.py with &&.
        run: >
          nix-shell -p klayout netgen magic-vlsi ngspice tk python3 --run
          "python3 scripts/run_stdcell_inv_gate.py --profile ami06 &&
          python3 scripts/run_stdcell_gate.py --profile ami06
          --architecture two_metal_classic --cell nand2_drc
          --input common/tests/spice/stdcell/nand2_drc.spice
          --schematic common/tests/spice/stdcell/nand2_drc_reference.spice
          --workdir build/stdcell/ami06/nand2_gate_pex_lef --pex --lef &&
          python3 scripts/run_stdcell_gate.py --profile ami06
          --architecture three_metal_classic --cell nor2_drc
          --input common/tests/spice/stdcell/nor2_drc.spice
          --schematic common/tests/spice/stdcell/nor2_drc_reference.spice
          --workdir build/stdcell/ami06/nor2_gate"

  pex:
    name: Native and Magic PEX contract and runtime gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - name: Run source-reference and native PEX gates
        run: >
          nix-shell -p klayout magic-vlsi netgen ngspice tk python3 --run
          "python3 scripts/run_pex_ci.py"
      - name: Run L0 RF workbench
        run: >
          nix-shell -p magic-vlsi python3 --run
          "python3 scripts/test_rf_workbench.py &&
          python3 scripts/run_rf_workbench.py
          --profile ami06 --pex-profile n8bn_reference --require-rc
          --output /tmp/siliconcraft-ami06-rf.json
          --extracted-output /tmp/siliconcraft-ami06-rf.spice"
